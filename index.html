*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0A0806;
  color: #C4B9A7;
  font-family: 'Convergence', 'Segoe UI', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.9;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

#game-container {
  width: 800px;
  max-width: 100vw;
  height: 600px;
  max-height: 100vh;
  display: flex;
  flex-direction: column;
  border: 1px solid #2A2218;
  background: #110E0A;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 80px rgba(10, 8, 6, 0.9);
}

#art-panel {
  height: 280px;
  background: #0A0806;
  border-bottom: 1px solid #2A2218;
  position: relative;
  overflow: hidden;
}

#art-canvas {
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

#text-panel {
  flex: 1;
  padding: 24px 32px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 0;
  scrollbar-width: thin;
  scrollbar-color: #2A2218 transparent;
  background: linear-gradient(to bottom, #110E0A, #0D0B08);
}

#text-panel::-webkit-scrollbar { width: 3px; }
#text-panel::-webkit-scrollbar-track { background: transparent; }
#text-panel::-webkit-scrollbar-thumb { background: #2A2218; }

.text-line {
  opacity: 0;
  margin-bottom: 14px;
}

.text-line.visible {
  animation: textFade 0.8s ease forwards;
}

@keyframes textFade {
  0% { opacity: 0; transform: translateY(6px); }
  100% { opacity: 1; transform: translateY(0); }
}

.text-narrator {
  color: #A09585;
}

.text-thought {
  color: #8A7E72;
  font-style: italic;
}

.text-system {
  color: #6B5D3E;
  font-size: 12px;
  letter-spacing: 3px;
  text-transform: uppercase;
  text-align: center;
  margin-top: 8px;
  margin-bottom: 8px;
}

.text-title-line {
  color: #C9A84C;
  font-size: 13px;
  letter-spacing: 4px;
  text-transform: uppercase;
  text-align: center;
  margin-top: 20px;
}

/* === TITLE SCREEN === */
#title-screen {
  position: absolute;
  inset: 0;
  background: #0A0806;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10;
}

#title-screen h1 {
  font-family: 'Convergence', 'Segoe UI', system-ui, sans-serif;
  font-size: 28px;
  font-weight: 400;
  color: #C9A84C;
  text-shadow: 0 0 40px rgba(201, 168, 76, 0.2);
  margin-bottom: 4px;
  letter-spacing: 8px;
  text-transform: uppercase;
}

#title-screen .subtitle {
  font-size: 12px;
  color: #6B5D3E;
  margin-bottom: 50px;
  letter-spacing: 3px;
}

#title-screen canvas {
  image-rendering: pixelated;
  margin-bottom: 32px;
}

.title-btn {
  background: transparent;
  border: 1px solid #3D2E1A;
  color: #C9A84C;
  font-family: 'Convergence', 'Segoe UI', system-ui, sans-serif;
  font-size: 14px;
  padding: 12px 44px;
  cursor: pointer;
  transition: all 0.3s ease;
  letter-spacing: 4px;
  text-transform: uppercase;
}

.title-btn:hover {
  background: rgba(201, 168, 76, 0.08);
  border-color: #C9A84C;
  box-shadow: 0 0 24px rgba(201, 168, 76, 0.1);
}

.title-btn:focus-visible {
  outline: 1px solid #C9A84C;
  outline-offset: 3px;
}

/* === CLICK PROMPT === */
.click-prompt {
  text-align: center;
  color: #3D2E1A;
  font-size: 11px;
  letter-spacing: 2px;
  margin-top: 12px;
  animation: pulse 2.5s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.7; }
}

/* === CHOICES PANEL === */
#choices-panel {
  display: none;
  border-top: 1px solid #2A2218;
  padding: 12px 24px;
  flex-direction: column;
  gap: 6px;
  background: #0D0B08;
}

#choices-panel.active { display: flex; }

.choice-btn {
  background: transparent;
  border: 1px solid #2A2218;
  border-left: 2px solid #3D2E1A;
  color: #A09585;
  font-family: 'Convergence', 'Segoe UI', system-ui, sans-serif;
  font-size: 13px;
  padding: 10px 16px 10px 18px;
  text-align: left;
  cursor: pointer;
  transition: all 0.2s ease;
  line-height: 1.6;
}

.choice-btn:hover {
  background: rgba(201, 168, 76, 0.06);
  border-color: #3D2E1A;
  border-left-color: #C9A84C;
  color: #C9A84C;
}

.choice-btn:focus-visible {
  outline: 1px solid #C9A84C;
  outline-offset: 1px;
}

/* === GAME OVER === */
#gameover-overlay {
  position: absolute;
  inset: 0;
  background: rgba(10, 8, 6, 0);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 20;
  transition: background 2s ease;
}

#gameover-overlay.active {
  display: flex;
  background: rgba(10, 8, 6, 0.92);
}

.go-content {
  text-align: center;
  max-width: 420px;
  padding: 0 24px;
  opacity: 0;
  animation: endFade 2s ease 0.8s forwards;
}

.go-title {
  color: #A63D3D;
  font-size: 16px;
  letter-spacing: 3px;
  margin-bottom: 20px;
}

.go-text {
  color: #6B5D3E;
  font-size: 13px;
  line-height: 2;
  margin-bottom: 28px;
}

.go-label {
  color: #3D2E1A;
  font-size: 11px;
  letter-spacing: 5px;
  text-transform: uppercase;
  margin-bottom: 24px;
}

/* === HEAT SHIMMER === */
.heat-line {
  position: absolute;
  left: 0;
  width: 100%;
  height: 1px;
  background: rgba(201, 168, 76, 0.03);
  animation: shimmer 4s ease-in-out infinite;
}

@keyframes shimmer {
  0%, 100% { transform: scaleX(1); opacity: 0.3; }
  50% { transform: scaleX(1.02); opacity: 0.6; }
}

/* === END SCREEN FADE === */
#end-overlay {
  position: absolute;
  inset: 0;
  background: rgba(10, 8, 6, 0);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 5;
  transition: background 3s ease;
}

#end-overlay.active {
  display: flex;
  background: rgba(10, 8, 6, 0.7);
}

#end-overlay .end-text {
  color: #6B5D3E;
  font-size: 12px;
  letter-spacing: 5px;
  text-transform: uppercase;
  opacity: 0;
  animation: endFade 2s ease 1.5s forwards;
}

@keyframes endFade {
  to { opacity: 1; }
}

/* === SAND PARTICLES === */
.sand-particle {
  position: absolute;
  width: 1px;
  height: 1px;
  background: rgba(180, 150, 100, 0.3);
  pointer-events: none;
  animation: drift linear forwards;
}

@keyframes drift {
  0% { opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { opacity: 0; transform: translate(60px, 20px); }
}
</style>
</head>
<body>

<div id="game-container">
  <div id="title-screen">
    <canvas id="title-art" width="400" height="160"></canvas>
    <h1>Shattered Realms</h1>
    <p class="subtitle">a tale of dust and chains</p>
    <button class="title-btn" onclick="startGame()">Begin</button>
  </div>

  <div id="art-panel">
    <canvas id="art-canvas" width="800" height="280"></canvas>
  </div>

  <div id="text-panel"></div>

  <div id="choices-panel"></div>

  <div id="end-overlay">
    <span class="end-text">to be continued</span>
  </div>

  <div id="gameover-overlay">
    <div class="go-content">
      <div class="go-title">You gave up.</div>
      <div class="go-text">The dust fills your lungs. The work breaks your hands. Weeks pass, then months. You stop counting. One morning you don't get up. Nobody notices.</div>
      <div class="go-label">game over</div>
      <button class="title-btn" onclick="location.reload()">Try again</button>
    </div>
  </div>
</div>

<script>
const textPanel = document.getElementById('text-panel');
const artCanvas = document.getElementById('art-canvas');
const artCtx = artCanvas.getContext('2d');

// ============================================================
// DESERT SCENE RENDERER
// ============================================================
function drawDesert(ctx, w, h) {
  // Sky gradient — pale scorched horizon to deep bruised blue
  const sky = ctx.createLinearGradient(0, 0, 0, h * 0.6);
  sky.addColorStop(0, '#1A2844');
  sky.addColorStop(0.3, '#2E3E5A');
  sky.addColorStop(0.6, '#6B5A42');
  sky.addColorStop(0.8, '#A08050');
  sky.addColorStop(1, '#C8A060');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, h * 0.6);

  // Sun — harsh white disc with glow
  const sunX = w * 0.72, sunY = h * 0.18, sunR = 18;
  const sunGlow = ctx.createRadialGradient(sunX, sunY, sunR * 0.5, sunX, sunY, sunR * 6);
  sunGlow.addColorStop(0, 'rgba(255, 240, 200, 0.5)');
  sunGlow.addColorStop(0.3, 'rgba(255, 220, 160, 0.15)');
  sunGlow.addColorStop(1, 'rgba(255, 200, 120, 0)');
  ctx.fillStyle = sunGlow;
  ctx.fillRect(0, 0, w, h * 0.6);

  ctx.fillStyle = '#FFF0D0';
  ctx.beginPath();
  ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
  ctx.fill();

  // Distant empire buildings — silhouettes on the horizon
  const horizonY = h * 0.52;

  // Haze band at horizon
  const haze = ctx.createLinearGradient(0, horizonY - 20, 0, horizonY + 10);
  haze.addColorStop(0, 'rgba(200, 170, 120, 0)');
  haze.addColorStop(0.5, 'rgba(200, 170, 120, 0.15)');
  haze.addColorStop(1, 'rgba(200, 170, 120, 0)');
  ctx.fillStyle = haze;
  ctx.fillRect(0, horizonY - 20, w, 30);

  // Empire structures — distant ziggurat/pyramid
  ctx.fillStyle = '#3A3020';
  // Large pyramid
  ctx.beginPath();
  ctx.moveTo(w * 0.35, horizonY);
  ctx.lineTo(w * 0.40, horizonY - 45);
  ctx.lineTo(w * 0.45, horizonY);
  ctx.fill();

  // Smaller pyramid
  ctx.fillStyle = '#352C1C';
  ctx.beginPath();
  ctx.moveTo(w * 0.48, horizonY);
  ctx.lineTo(w * 0.51, horizonY - 28);
  ctx.lineTo(w * 0.54, horizonY);
  ctx.fill();

  // Tower/obelisk
  ctx.fillStyle = '#3A3020';
  ctx.fillRect(w * 0.58, horizonY - 35, 6, 35);
  ctx.fillRect(w * 0.56, horizonY - 38, 10, 5);

  // Low buildings cluster
  ctx.fillStyle = '#332A1C';
  for (let i = 0; i < 8; i++) {
    const bx = w * 0.2 + i * 14 + Math.sin(i * 2.5) * 8;
    const bh = 8 + Math.sin(i * 1.7) * 6;
    ctx.fillRect(bx, horizonY - bh, 10, bh);
  }

  // Right side structures
  ctx.fillStyle = '#38301E';
  for (let i = 0; i < 5; i++) {
    const bx = w * 0.65 + i * 18;
    const bh = 6 + Math.sin(i * 2.1) * 5;
    ctx.fillRect(bx, horizonY - bh, 12, bh);
  }

  // Far dunes — background layer
  ctx.fillStyle = '#8B7040';
  ctx.beginPath();
  ctx.moveTo(0, horizonY + 5);
  for (let x = 0; x <= w; x += 4) {
    const y = horizonY + 5 + Math.sin(x * 0.008) * 12 + Math.sin(x * 0.003 + 1) * 8;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(w, h);
  ctx.lineTo(0, h);
  ctx.fill();

  // Mid dunes
  ctx.fillStyle = '#9A7D48';
  ctx.beginPath();
  ctx.moveTo(0, horizonY + 25);
  for (let x = 0; x <= w; x += 4) {
    const y = horizonY + 25 + Math.sin(x * 0.006 + 0.5) * 15 + Math.sin(x * 0.015) * 6;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(w, h);
  ctx.lineTo(0, h);
  ctx.fill();

  // Light-catch on dune crests
  ctx.strokeStyle = 'rgba(210, 180, 120, 0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= w; x += 4) {
    const y = horizonY + 25 + Math.sin(x * 0.006 + 0.5) * 15 + Math.sin(x * 0.015) * 6;
    if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Near dunes — foreground
  ctx.fillStyle = '#A8874E';
  ctx.beginPath();
  ctx.moveTo(0, horizonY + 55);
  for (let x = 0; x <= w; x += 4) {
    const y = horizonY + 55 + Math.sin(x * 0.005 + 2) * 18 + Math.sin(x * 0.012 + 1) * 8;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(w, h);
  ctx.lineTo(0, h);
  ctx.fill();

  // Ground — closest sand
  ctx.fillStyle = '#B89858';
  ctx.beginPath();
  ctx.moveTo(0, horizonY + 85);
  for (let x = 0; x <= w; x += 4) {
    const y = horizonY + 85 + Math.sin(x * 0.004 + 3) * 10;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(w, h);
  ctx.lineTo(0, h);
  ctx.fill();

  // Sand texture — scattered dots
  for (let i = 0; i < 200; i++) {
    const sx = Math.random() * w;
    const sy = horizonY + 40 + Math.random() * (h - horizonY - 40);
    const brightness = 0.03 + Math.random() * 0.06;
    ctx.fillStyle = `rgba(60, 40, 20, ${brightness})`;
    ctx.fillRect(sx, sy, 1 + Math.random(), 1);
  }
  for (let i = 0; i < 80; i++) {
    const sx = Math.random() * w;
    const sy = horizonY + 40 + Math.random() * (h - horizonY - 40);
    ctx.fillStyle = `rgba(220, 190, 140, ${0.02 + Math.random() * 0.04})`;
    ctx.fillRect(sx, sy, 1, 1);
  }

  // Mine entrance — dark cave in a rocky outcrop, right of center
  const mineX = w * 0.12;
  const mineY = horizonY + 70;

  // Rocky cliff face
  ctx.fillStyle = '#4A3A28';
  ctx.beginPath();
  ctx.moveTo(mineX - 30, h);
  ctx.lineTo(mineX - 25, mineY - 30);
  ctx.lineTo(mineX - 10, mineY - 45);
  ctx.lineTo(mineX + 10, mineY - 50);
  ctx.lineTo(mineX + 40, mineY - 42);
  ctx.lineTo(mineX + 60, mineY - 30);
  ctx.lineTo(mineX + 70, mineY - 20);
  ctx.lineTo(mineX + 80, h);
  ctx.fill();

  // Rock highlights
  ctx.fillStyle = '#5A4A34';
  ctx.beginPath();
  ctx.moveTo(mineX - 10, mineY - 45);
  ctx.lineTo(mineX + 10, mineY - 50);
  ctx.lineTo(mineX + 20, mineY - 40);
  ctx.lineTo(mineX - 5, mineY - 38);
  ctx.fill();

  // Rock texture
  ctx.fillStyle = '#3E3020';
  for (let i = 0; i < 15; i++) {
    const rx = mineX - 20 + Math.random() * 90;
    const ry = mineY - 40 + Math.random() * 60;
    ctx.fillRect(rx, ry, 2 + Math.random() * 4, 1 + Math.random() * 2);
  }

  // Mine entrance — black void
  ctx.fillStyle = '#0A0806';
  ctx.beginPath();
  ctx.moveTo(mineX, mineY + 2);
  ctx.lineTo(mineX + 5, mineY - 18);
  ctx.lineTo(mineX + 35, mineY - 18);
  ctx.lineTo(mineX + 40, mineY + 2);
  ctx.lineTo(mineX + 40, h * 0.95);
  ctx.lineTo(mineX, h * 0.95);
  ctx.fill();

  // Darker interior
  ctx.fillStyle = '#050403';
  ctx.fillRect(mineX + 5, mineY - 10, 30, 50);

  // Wooden support beams
  ctx.fillStyle = '#5A4020';
  ctx.fillRect(mineX - 1, mineY - 18, 4, h * 0.95 - mineY + 18);
  ctx.fillRect(mineX + 37, mineY - 18, 4, h * 0.95 - mineY + 18);
  ctx.fillRect(mineX - 1, mineY - 20, 42, 4);

  // Beam wood grain
  ctx.fillStyle = '#4A3418';
  ctx.fillRect(mineX, mineY - 5, 2, 20);
  ctx.fillRect(mineX + 38, mineY + 5, 2, 15);

  // Cart tracks leading to mine
  ctx.strokeStyle = 'rgba(80, 60, 30, 0.25)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(mineX + 15, h);
  ctx.lineTo(mineX + 18, mineY + 10);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(mineX + 25, h);
  ctx.lineTo(mineX + 24, mineY + 10);
  ctx.stroke();

  // Chains on ground near entrance
  ctx.strokeStyle = '#6A6A6A';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 4; i++) {
    const cx = mineX + 50 + i * 6;
    const cy = h * 0.92 + Math.sin(i) * 2;
    ctx.beginPath();
    ctx.arc(cx, cy, 3, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Pickaxe leaning against rock
  ctx.strokeStyle = '#5A4A38';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(mineX + 65, mineY - 5);
  ctx.lineTo(mineX + 55, h * 0.92);
  ctx.stroke();
  ctx.fillStyle = '#6A6A6A';
  ctx.beginPath();
  ctx.moveTo(mineX + 63, mineY - 6);
  ctx.lineTo(mineX + 72, mineY - 2);
  ctx.lineTo(mineX + 68, mineY + 3);
  ctx.lineTo(mineX + 63, mineY);
  ctx.fill();

  // Vultures in sky
  drawVulture(ctx, w * 0.2, h * 0.12, 1);
  drawVulture(ctx, w * 0.28, h * 0.08, 0.7);
  drawVulture(ctx, w * 0.85, h * 0.15, 0.8);

  // Dead tree — far right
  ctx.strokeStyle = '#3A2A18';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(w * 0.88, h);
  ctx.lineTo(w * 0.87, horizonY + 50);
  ctx.stroke();
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(w * 0.87, horizonY + 55);
  ctx.lineTo(w * 0.84, horizonY + 42);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(w * 0.87, horizonY + 60);
  ctx.lineTo(w * 0.91, horizonY + 48);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(w * 0.87, horizonY + 68);
  ctx.lineTo(w * 0.83, horizonY + 58);
  ctx.stroke();

  // Second dead tree — far left
  ctx.strokeStyle = '#352818';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(w * 0.03, h);
  ctx.lineTo(w * 0.035, horizonY + 65);
  ctx.stroke();
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(w * 0.035, horizonY + 68);
  ctx.lineTo(w * 0.02, horizonY + 58);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(w * 0.035, horizonY + 72);
  ctx.lineTo(w * 0.05, horizonY + 62);
  ctx.stroke();

  // Heat shimmer lines near horizon
  ctx.strokeStyle = 'rgba(200, 170, 120, 0.04)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 5; i++) {
    const sy = horizonY + 2 + i * 4;
    ctx.beginPath();
    for (let x = 0; x <= w; x += 8) {
      const y = sy + Math.sin(x * 0.02 + i) * 1.5;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  // Subtle dust in air
  for (let i = 0; i < 40; i++) {
    const dx = Math.random() * w;
    const dy = Math.random() * h * 0.55;
    ctx.fillStyle = `rgba(200, 170, 120, ${0.01 + Math.random() * 0.03})`;
    ctx.fillRect(dx, dy, 1, 1);
  }
}

function drawVulture(ctx, x, y, scale) {
  ctx.strokeStyle = '#1A1510';
  ctx.lineWidth = 1.5 * scale;
  ctx.beginPath();
  ctx.moveTo(x - 10 * scale, y + 2 * scale);
  ctx.quadraticCurveTo(x - 5 * scale, y - 3 * scale, x, y);
  ctx.quadraticCurveTo(x + 5 * scale, y - 3 * scale, x + 10 * scale, y + 2 * scale);
  ctx.stroke();
}

// ============================================================
// TITLE SCREEN DESERT
// ============================================================
function drawTitleDesert(canvas) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;

  const sky = ctx.createLinearGradient(0, 0, 0, h * 0.6);
  sky.addColorStop(0, '#1A2844');
  sky.addColorStop(0.5, '#4A4030');
  sky.addColorStop(1, '#8A7040');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, h * 0.6);

  // Sun
  const sunGlow = ctx.createRadialGradient(w * 0.5, h * 0.22, 5, w * 0.5, h * 0.22, 50);
  sunGlow.addColorStop(0, 'rgba(255, 240, 200, 0.4)');
  sunGlow.addColorStop(1, 'rgba(255, 220, 160, 0)');
  ctx.fillStyle = sunGlow;
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#FFF0D0';
  ctx.beginPath();
  ctx.arc(w * 0.5, h * 0.22, 8, 0, Math.PI * 2);
  ctx.fill();

  // Dunes
  ctx.fillStyle = '#9A7D48';
  ctx.beginPath();
  ctx.moveTo(0, h * 0.55);
  for (let x = 0; x <= w; x += 2) {
    ctx.lineTo(x, h * 0.55 + Math.sin(x * 0.015) * 10 + Math.sin(x * 0.006) * 15);
  }
  ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.fill();

  ctx.fillStyle = '#A8874E';
  ctx.beginPath();
  ctx.moveTo(0, h * 0.7);
  for (let x = 0; x <= w; x += 2) {
    ctx.lineTo(x, h * 0.7 + Math.sin(x * 0.01 + 1) * 12);
  }
  ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.fill();

  ctx.fillStyle = '#B89858';
  ctx.fillRect(0, h * 0.82, w, h * 0.18);

  // Pyramid silhouettes
  ctx.fillStyle = '#3A3020';
  ctx.beginPath();
  ctx.moveTo(w * 0.3, h * 0.55); ctx.lineTo(w * 0.38, h * 0.3); ctx.lineTo(w * 0.46, h * 0.55);
  ctx.fill();
  ctx.fillStyle = '#352C1C';
  ctx.beginPath();
  ctx.moveTo(w * 0.55, h * 0.55); ctx.lineTo(w * 0.6, h * 0.38); ctx.lineTo(w * 0.65, h * 0.55);
  ctx.fill();

  // Vultures
  drawVulture(ctx, w * 0.25, h * 0.12, 0.5);
  drawVulture(ctx, w * 0.75, h * 0.1, 0.4);
}

// ============================================================
// TEXT ENGINE — click to advance
// ============================================================
const PAGES = [
  { type: 'narrator', text: 'The empire is a cold and distant land, even with the sun almost burning your skin. You grew up in the north, a land where companionship is deadly. But even so you found one. Well, more like were born with one.' },
  { type: 'narrator', text: 'Your parents were as loving as they could be. Not like you experienced any greater warmth. They didn\'t beat you or shower you with love. They were just there. Unfeeling and cold as stone. Maybe they couldn\'t even be bothered to hit you, to feel something else.' },
  { type: 'narrator', text: 'You grew up to be the same. And when the guards told you they were killed and you did it, they took your distant stare as the admission of guilt. Turns out you were a province of the empire, even though no one saw it that way.' },
  { type: 'narrator', text: 'They threw you into Chrosireth, a coal mine where you will spend the rest of your life. Just a child, but already having your hands bleed from the work and your lungs fill with dust and smoke. You spend a week thinking that this is temporary.' },
  { type: 'narrator', text: 'But it\'s not. You will die here unless you do something. But how? You didn\'t even meet that many people yet. Should you try to find allies, or finally rely on yourself? Since trusting someone didn\'t turn out so well last time.' },
];

let currentPage = 0;
let waitingForClick = false;

async function playIntro() {
  document.getElementById('title-screen').style.display = 'none';
  drawDesert(artCtx, artCanvas.width, artCanvas.height);
  startSandParticles();

  showPage(0);

  document.getElementById('game-container').addEventListener('click', handleAdvance);
  document.addEventListener('keydown', handleAdvanceKey);
}

function showPage(index) {
  if (index >= PAGES.length) {
    showChoices();
    return;
  }

  currentPage = index;
  textPanel.innerHTML = '';

  const page = PAGES[index];
  const div = document.createElement('div');
  div.className = `text-line text-${page.type}`;
  div.textContent = page.text;
  textPanel.appendChild(div);

  requestAnimationFrame(() => {
    div.classList.add('visible');
  });

  const prompt = document.createElement('div');
  prompt.className = 'click-prompt';
  prompt.textContent = 'click to continue';
  prompt.id = 'click-prompt';
  textPanel.appendChild(prompt);
  setTimeout(() => prompt.classList.add('visible'), 600);

  waitingForClick = true;
}

function handleAdvance(e) {
  if (e.target.closest('#choices-panel') || e.target.closest('#title-screen') || e.target.closest('#gameover-overlay')) return;
  if (!waitingForClick) return;
  waitingForClick = false;
  showPage(currentPage + 1);
}

function handleAdvanceKey(e) {
  if (!waitingForClick) return;
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    waitingForClick = false;
    showPage(currentPage + 1);
  }
}

function showChoices() {
  textPanel.innerHTML = '';
  document.getElementById('game-container').removeEventListener('click', handleAdvance);
  document.removeEventListener('keydown', handleAdvanceKey);

  const panel = document.getElementById('choices-panel');
  panel.classList.add('active');
  panel.innerHTML = '';

  const choices = [
    { text: 'Try to escape on your own. Trust no one.', action: 'solo' },
    { text: 'Look for allies among the other prisoners.', action: 'allies' },
    { text: 'Give up. Accept your fate.', action: 'gameover' },
  ];

  choices.forEach((choice, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = choice.text;
    btn.style.opacity = '0';
    btn.style.animation = `textFade 0.6s ease ${0.2 + i * 0.15}s forwards`;
    btn.onclick = () => handleChoice(choice.action);
    panel.appendChild(btn);
  });
}

function handleChoice(action) {
  const panel = document.getElementById('choices-panel');

  if (action === 'gameover') {
    panel.classList.remove('active');
    const overlay = document.getElementById('gameover-overlay');
    overlay.style.display = 'flex';
    requestAnimationFrame(() => overlay.classList.add('active'));
    return;
  }

  // Solo or allies — end of demo
  panel.classList.remove('active');
  textPanel.innerHTML = '';

  const div = document.createElement('div');
  div.className = 'text-line text-narrator';
  if (action === 'solo') {
    div.textContent = 'You clench your bleeding fists. If the world gives you nothing, you\'ll take what you need. Alone.';
  } else {
    div.textContent = 'You look around the mine shaft. Somewhere in this darkness, there must be others who haven\'t given up yet.';
  }
  textPanel.appendChild(div);
  requestAnimationFrame(() => div.classList.add('visible'));

  setTimeout(() => {
    const overlay = document.getElementById('end-overlay');
    overlay.style.display = 'flex';
    requestAnimationFrame(() => overlay.classList.add('active'));
  }, 3000);
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ============================================================
// SAND PARTICLES
// ============================================================
function startSandParticles() {
  const panel = document.getElementById('art-panel');
  setInterval(() => {
    const p = document.createElement('div');
    p.className = 'sand-particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.top = (30 + Math.random() * 60) + '%';
    const duration = 3 + Math.random() * 4;
    p.style.animationDuration = duration + 's';
    panel.appendChild(p);
    setTimeout(() => p.remove(), duration * 1000);
  }, 300);
}

// ============================================================
// INIT
// ============================================================
function startGame() {
  playIntro();
}

drawTitleDesert(document.getElementById('title-art'));
</script>
