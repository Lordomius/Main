<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shattered Realms</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --void: #090C14;
  --stone: #131820;
  --stone-raised: #1C2230;
  --edge: #2A3040;
  --edge-lit: #3D4558;
  --gilt: #C9A84C;
  --gilt-glow: rgba(201, 168, 76, 0.12);
  --gilt-dim: #7A6530;
  --blood: #A63D3D;
  --arcane: #4A6FA5;
  --verdant: #4A8B5E;
  --bone: #C4B9A7;
  --ash: #6B6358;
  --ember: #D47B3E;
  --frost: #7BA4C7;
  --whisper: #8A8292;
}

body {
  background: var(--void);
  color: var(--bone);
  font-family: 'Menlo', 'Monaco', 'Cascadia Mono', 'Consolas', 'Courier New', monospace;
  font-size: 10px;
  line-height: 1.8;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

#game-container {
  width: 800px;
  max-width: 100vw;
  height: 600px;
  max-height: 100vh;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--edge);
  box-shadow: 0 0 60px rgba(9, 12, 20, 0.8), inset 0 0 1px var(--edge-lit);
  background: var(--stone);
  position: relative;
  overflow: hidden;
}

/* === PIXEL ART DISPLAY === */
#art-panel {
  height: 240px;
  background: #060910;
  border-bottom: 1px solid var(--edge);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

#art-canvas {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

/* === HUD === */
#hud {
  display: none;
  height: 36px;
  background: #0C1018;
  border-bottom: 1px solid var(--edge);
  padding: 4px 12px;
  align-items: center;
  gap: 16px;
  font-size: 8px;
  letter-spacing: 0.5px;
}

#hud.active { display: flex; }

.hud-stat {
  display: flex;
  align-items: center;
  gap: 6px;
}

.bar-container {
  width: 80px;
  height: 6px;
  background: #0A0E16;
  border: 1px solid var(--edge);
}

.bar-fill {
  height: 100%;
  transition: width 0.4s ease;
}

.bar-fill.hp { background: var(--blood); }
.bar-fill.mp { background: var(--arcane); }
.bar-fill.xp { background: var(--verdant); }

.hud-label { color: var(--ash); text-transform: uppercase; letter-spacing: 1px; }
.hud-value { color: var(--gilt); min-width: 40px; font-variant-numeric: tabular-nums; }

/* === TEXT PANEL === */
#text-panel {
  flex: 1;
  padding: 16px 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  scrollbar-width: thin;
  scrollbar-color: var(--edge) transparent;
}

#text-panel::-webkit-scrollbar { width: 4px; }
#text-panel::-webkit-scrollbar-track { background: transparent; }
#text-panel::-webkit-scrollbar-thumb { background: var(--edge); }

.text-line {
  opacity: 0;
  animation: fadeIn 0.35s ease forwards;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

.text-narrator { color: var(--bone); }
.text-dialogue { color: var(--frost); }
.text-combat { color: var(--blood); }
.text-system { color: var(--gilt); font-size: 8px; text-transform: uppercase; letter-spacing: 0.8px; }
.text-loot { color: var(--ember); }

/* === CHOICES PANEL === */
#choices-panel {
  min-height: 80px;
  border-top: 1px solid var(--edge);
  padding: 10px 16px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  background: #0C1018;
}

.choice-btn {
  background: transparent;
  border: 1px solid var(--edge);
  border-left: 2px solid var(--gilt-dim);
  color: var(--bone);
  font-family: inherit;
  font-size: 9px;
  padding: 7px 12px 7px 14px;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s ease;
  line-height: 1.6;
}

.choice-btn:hover {
  background: var(--gilt-glow);
  border-color: var(--gilt-dim);
  border-left-color: var(--gilt);
  color: var(--gilt);
}

.choice-btn:focus-visible {
  outline: 1px solid var(--gilt);
  outline-offset: 1px;
}

.choice-btn:active {
  transform: scale(0.98);
}

.choice-btn.combat-btn {
  display: inline-block;
  width: auto;
  text-align: center;
  padding: 7px 16px;
  border-left-width: 1px;
}

#combat-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

/* === TITLE SCREEN === */
#title-screen {
  position: absolute;
  inset: 0;
  background: var(--void);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10;
}

#title-screen h1 {
  font-size: 18px;
  color: var(--gilt);
  text-shadow: 0 0 30px rgba(201, 168, 76, 0.3);
  margin-bottom: 6px;
  letter-spacing: 6px;
  text-transform: uppercase;
  font-weight: normal;
}

#title-screen .subtitle {
  font-size: 8px;
  color: var(--ash);
  margin-bottom: 40px;
  letter-spacing: 2px;
  text-transform: lowercase;
  font-style: italic;
}

#title-screen canvas {
  image-rendering: pixelated;
  margin-bottom: 24px;
}

.title-btn {
  background: transparent;
  border: 1px solid var(--gilt-dim);
  color: var(--gilt);
  font-family: inherit;
  font-size: 10px;
  padding: 10px 36px;
  cursor: pointer;
  transition: all 0.2s ease;
  margin: 6px 0;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.title-btn:hover {
  background: var(--gilt);
  color: var(--void);
  box-shadow: 0 0 20px rgba(201, 168, 76, 0.2);
}

.title-btn:focus-visible {
  outline: 1px solid var(--gilt);
  outline-offset: 3px;
}

/* === CHARACTER CREATION === */
#char-create {
  position: absolute;
  inset: 0;
  background: var(--void);
  display: none;
  flex-direction: column;
  align-items: center;
  padding: 30px;
  z-index: 10;
  overflow-y: auto;
}

#char-create h2 {
  font-size: 12px;
  color: var(--gilt);
  margin-bottom: 20px;
  letter-spacing: 4px;
  text-transform: uppercase;
  font-weight: normal;
}

#name-input {
  background: var(--stone);
  border: 1px solid var(--edge);
  color: var(--bone);
  font-family: inherit;
  font-size: 10px;
  padding: 10px 16px;
  width: 260px;
  text-align: center;
  margin-bottom: 20px;
  outline: none;
}

#name-input:focus { border-color: var(--gilt-dim); box-shadow: 0 0 12px rgba(201, 168, 76, 0.1); }

.class-grid {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
}

.class-card {
  width: 160px;
  border: 1px solid var(--edge);
  padding: 14px 12px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s ease;
  background: var(--stone);
}

.class-card:hover, .class-card.selected {
  border-color: var(--gilt-dim);
  background: var(--stone-raised);
  box-shadow: 0 0 16px rgba(201, 168, 76, 0.06);
}

.class-card canvas {
  image-rendering: pixelated;
  margin-bottom: 8px;
}

.class-card h3 {
  font-size: 9px;
  color: var(--gilt);
  margin-bottom: 6px;
  letter-spacing: 2px;
  text-transform: uppercase;
  font-weight: normal;
}

.class-card p {
  font-size: 7px;
  color: var(--ash);
}

.class-stats {
  font-size: 7px;
  color: var(--bone);
  margin-top: 10px;
  text-align: left;
  line-height: 2;
  font-variant-numeric: tabular-nums;
}

/* === DAMAGE NUMBERS === */
.damage-number {
  position: absolute;
  font-family: inherit;
  font-size: 14px;
  font-weight: bold;
  pointer-events: none;
  animation: floatUp 1s ease-out forwards;
  z-index: 20;
  text-shadow: 1px 1px 0 #000, 2px 2px 0 rgba(0,0,0,0.5);
}

@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  30% { transform: translateY(-10px) scale(1.15); }
  100% { opacity: 0; transform: translateY(-40px) scale(0.9); }
}

.shake {
  animation: shake 0.3s ease-out;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-3px); }
  40% { transform: translateX(3px); }
  60% { transform: translateX(-2px); }
  80% { transform: translateX(1px); }
}

/* === INVENTORY OVERLAY === */
#inventory-overlay {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(9, 12, 20, 0.92);
  z-index: 20;
  padding: 30px;
  flex-direction: column;
  align-items: center;
  backdrop-filter: blur(2px);
}

#inventory-overlay.active { display: flex; }

#inventory-overlay h2 {
  font-size: 12px;
  color: var(--gilt);
  margin-bottom: 16px;
  letter-spacing: 4px;
  text-transform: uppercase;
  font-weight: normal;
}

.inv-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  max-width: 500px;
  width: 100%;
}

.inv-slot {
  background: var(--stone);
  border: 1px solid var(--edge);
  padding: 8px;
  font-size: 8px;
  text-align: center;
  min-height: 60px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.inv-slot .item-name { color: var(--gilt); text-transform: uppercase; letter-spacing: 0.5px; }
.inv-slot .item-desc { color: var(--ash); font-size: 7px; }
.inv-slot .item-qty { color: var(--verdant); }

.inv-close {
  margin-top: 16px;
  background: transparent;
  border: 1px solid var(--gilt-dim);
  color: var(--gilt);
  font-family: inherit;
  font-size: 9px;
  padding: 8px 24px;
  cursor: pointer;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.inv-close:hover {
  background: var(--gilt-glow);
}

/* === TRANSITIONS === */
.fade-out { animation: fadeOut 0.5s ease forwards; }
.fade-in { animation: fadeIn 0.5s ease forwards; }

@keyframes fadeOut {
  to { opacity: 0; }
}
</style>
</head>
<body>

<div id="game-container">
  <!-- Title Screen -->
  <div id="title-screen">
    <canvas id="title-art" width="128" height="64"></canvas>
    <h1>SHATTERED REALMS</h1>
    <p class="subtitle">A tale of choices and consequence</p>
    <button class="title-btn" onclick="startNewGame()">NEW GAME</button>
  </div>

  <!-- Character Creation -->
  <div id="char-create">
    <h2>FORGE YOUR DESTINY</h2>
    <input type="text" id="name-input" placeholder="Enter your name..." maxlength="12">
    <div class="class-grid" id="class-grid"></div>
    <button class="title-btn" id="begin-btn" onclick="beginAdventure()" style="display:none">BEGIN</button>
  </div>

  <!-- Game Panels -->
  <div id="art-panel">
    <canvas id="art-canvas" width="800" height="240"></canvas>
  </div>

  <div id="hud">
    <div class="hud-stat">
      <span class="hud-label">HP</span>
      <div class="bar-container"><div class="bar-fill hp" id="hud-hp"></div></div>
      <span class="hud-value" id="hud-hp-text"></span>
    </div>
    <div class="hud-stat">
      <span class="hud-label">MP</span>
      <div class="bar-container"><div class="bar-fill mp" id="hud-mp"></div></div>
      <span class="hud-value" id="hud-mp-text"></span>
    </div>
    <div class="hud-stat">
      <span class="hud-label">LV</span>
      <span class="hud-value" id="hud-lv"></span>
    </div>
    <div class="hud-stat">
      <span class="hud-label">EXP</span>
      <div class="bar-container"><div class="bar-fill xp" id="hud-xp"></div></div>
    </div>
    <div class="hud-stat" style="margin-left:auto">
      <span class="hud-label">GOLD</span>
      <span class="hud-value" id="hud-gold"></span>
    </div>
  </div>

  <div id="text-panel"></div>
  <div id="choices-panel"></div>

  <!-- Inventory Overlay -->
  <div id="inventory-overlay">
    <h2>INVENTORY</h2>
    <div class="inv-grid" id="inv-grid"></div>
    <button class="inv-close" onclick="closeInventory()">CLOSE</button>
  </div>
</div>

function drawSprite(ctx, sprite, x, y, scale) {
  const lines = sprite.trim().split('\n').map(l => l.trim());
  for (let row = 0; row < lines.length; row++) {
    for (let col = 0; col < lines[row].length; col++) {
      const ch = lines[row][col];
      if (ch === '_' || ch === ' ') continue;
      const color = PAL[ch];
      if (!color || color === 'transparent') continue;
      ctx.fillStyle = color;
      ctx.fillRect(x + col * scale, y + row * scale, scale, scale);
    }
  }
}

function drawScene(ctx, w, h, sceneName) {
  ctx.clearRect(0, 0, w, h);

  switch(sceneName) {
    case 'village':
      drawGradient(ctx, w, h, '#080C18', '#12101E');
      for (let i = 0; i < 30; i++) {
        ctx.fillStyle = '#C4B9A7';
        ctx.fillRect(Math.random()*w, Math.random()*h*0.5, 1, 1);
      }
      ctx.fillStyle = '#111A0E';
      ctx.fillRect(0, h*0.7, w, h*0.3);
      ctx.fillStyle = '#1A2814';
      ctx.fillRect(0, h*0.7, w, 4);
      drawSprite(ctx, SPRITES.house, 100, h*0.7 - 90, 4);
      drawSprite(ctx, SPRITES.house, 420, h*0.7 - 90, 4);
      drawSprite(ctx, SPRITES.tree, 300, h*0.7 - 60, 4);
      drawSprite(ctx, SPRITES.tree, 600, h*0.7 - 55, 3);
      drawSprite(ctx, SPRITES.campfire, 340, h*0.7 - 10, 2);
      break;

    case 'forest':
      drawGradient(ctx, w, h, '#081208', '#050D08');
      ctx.fillStyle = '#081608';
      ctx.fillRect(0, h*0.65, w, h*0.35);
      for (let i = 0; i < 7; i++) {
        const tx = i * 120 + Math.sin(i*3)*20;
        const ts = 3 + Math.sin(i*2)*1;
        drawSprite(ctx, SPRITES.tree, tx, h*0.65 - 50, ts);
      }
      drawMist(ctx, w, h);
      break;

    case 'dungeon':
      drawGradient(ctx, w, h, '#080808', '#100E16');
      for (let x = 0; x < w; x += 32) {
        ctx.fillStyle = x % 64 === 0 ? '#151520' : '#111118';
        ctx.fillRect(x, 0, 32, h);
      }
      ctx.fillStyle = '#0C0C14';
      ctx.fillRect(0, h*0.8, w, h*0.2);
      for (let i = 0; i < 10; i++) {
        ctx.fillStyle = `rgba(240, 192, 64, ${0.02 + Math.random()*0.03})`;
        ctx.fillRect(Math.random()*w, Math.random()*h, 2, 2);
      }
      break;

    case 'throne':
      drawGradient(ctx, w, h, '#140A16', '#0A050E');
      ctx.fillStyle = '#160E22';
      ctx.fillRect(w*0.3, h*0.1, w*0.4, h*0.8);
      ctx.fillStyle = '#1E1430';
      ctx.fillRect(w*0.35, h*0.15, w*0.3, h*0.2);
      ctx.fillStyle = var_accent_glow();
      ctx.fillRect(w*0.48, h*0.2, 30, 30);
      ctx.fillStyle = '#0E0618';
      ctx.fillRect(0, h*0.85, w, h*0.15);
      break;

    case 'crossroads':
      drawGradient(ctx, w, h, '#080E14', '#060C0E');
      ctx.fillStyle = '#101C14';
      ctx.fillRect(0, h*0.65, w, h*0.35);
      ctx.fillStyle = '#221C12';
      ctx.fillRect(w*0.4, h*0.5, w*0.2, h*0.5);
      ctx.fillStyle = '#221C12';
      ctx.fillRect(0, h*0.7, w, 16);
      drawSprite(ctx, SPRITES.tree, 50, h*0.65 - 50, 4);
      drawSprite(ctx, SPRITES.tree, 650, h*0.65 - 50, 4);
      break;

    default:
      drawGradient(ctx, w, h, '#090C14', '#131820');
  }
}

function var_accent_glow() { return 'rgba(201, 168, 76, 0.25)'; }

function drawGradient(ctx, w, h, c1, c2) {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, c1);
  g.addColorStop(1, c2);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
}

function drawMist(ctx, w, h) {
  for (let i = 0; i < 5; i++) {
    ctx.fillStyle = `rgba(100, 140, 100, ${0.03 + Math.random()*0.02})`;
    const my = h * 0.5 + Math.random() * h * 0.3;
    ctx.fillRect(0, my, w, 8 + Math.random()*12);
  }
}

function drawCombatScene(ctx, w, h, enemies, player) {
  drawGradient(ctx, w, h, '#090C14', '#131820');
  ctx.fillStyle = '#0C0F18';
  ctx.fillRect(0, h * 0.75, w, h * 0.25);

  if (player) {
    const pSprite = SPRITES[player.cls] || SPRITES.warrior;
    drawSprite(ctx, pSprite, 80, h * 0.75 - 80, 5);
  }

  if (enemies) {
    const spacing = Math.min(200, (w - 300) / enemies.length);
    enemies.forEach((e, i) => {
      if (e.hp > 0) {
        const sprite = SPRITES[e.spriteKey] || SPRITES.slime;
        const ex = 450 + i * spacing;
        const ey = h * 0.75 - 80;
        drawSprite(ctx, sprite, ex, ey, 4);

        ctx.fillStyle = '#0A0E16';
        ctx.fillRect(ex, ey - 14, 64, 6);
        ctx.fillStyle = '#A63D3D';
        ctx.fillRect(ex, ey - 14, 64 * (e.hp / e.maxHp), 6);
        ctx.fillStyle = '#C4B9A7';
        ctx.font = '8px monospace';
        ctx.fillText(e.name, ex, ey - 20);
      }
    });
  }
}

function drawTitleArt(canvas) {
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 128, 64);
  drawSprite(ctx, SPRITES.sword, 48, 8, 3);
}

// ============================================================
// GAME ENGINE
// ============================================================
function createPlayer(name, cls) {
  const c = CLASSES[cls];
  return {
    name, cls,
    hp: c.hp, maxHp: c.hp,
    mp: c.mp, maxMp: c.mp,
    atk: c.atk, def: c.def, spd: c.spd, mag: c.mag,
    level: 1, exp: 0, expNext: 50,
    gold: 0,
    inventory: {},
    abilities: [...c.abilities],
    buffs: [],
  };
}

function addItem(player, itemId, qty) {
  player.inventory[itemId] = (player.inventory[itemId] || 0) + qty;
}

function removeItem(player, itemId, qty) {
  if (player.inventory[itemId]) {
    player.inventory[itemId] -= qty;
    if (player.inventory[itemId] <= 0) delete player.inventory[itemId];
  }
}

function levelUp(player) {
  player.level++;
  player.maxHp += 10 + Math.floor(Math.random() * 5);
  player.maxMp += 5 + Math.floor(Math.random() * 3);
  player.atk += 2;
  player.def += 2;
  player.spd += 1;
  player.mag += 1;
  player.hp = player.maxHp;
  player.mp = player.maxMp;
  player.expNext = Math.floor(player.expNext * 1.5);
}

function checkLevelUp(player) {
  while (player.exp >= player.expNext) {
    player.exp -= player.expNext;
    levelUp(player);
    addTextLine('system', `LEVEL UP! You are now level ${player.level}!`);
  }
}

// ============================================================
// UI ENGINE
// ============================================================
const textPanel = document.getElementById('text-panel');
const choicesPanel = document.getElementById('choices-panel');
const artCanvas = document.getElementById('art-canvas');
const artCtx = artCanvas.getContext('2d');

function clearText() {
  textPanel.innerHTML = '';
}

function addTextLine(type, text) {
  const div = document.createElement('div');
  div.className = `text-line text-${type}`;
  div.textContent = text;
  textPanel.appendChild(div);
  textPanel.scrollTop = textPanel.scrollHeight;
}

async function typeText(lines) {
  state.isTyping = true;
  for (const line of lines) {
    let text = line.text;
    text = text.replace('{playerName}', state.player?.name || 'Hero');
    text = text.replace('{className}', state.player ? CLASSES[state.player.cls].name : 'Adventurer');

    if (line.speaker) {
      addTextLine('dialogue', `${line.speaker}: ${text}`);
    } else {
      addTextLine(line.type || 'narrator', text);
    }
    await sleep(80);
  }
  state.isTyping = false;
}

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

function showChoices(choices) {
  choicesPanel.innerHTML = '';
  const filtered = choices.filter(c => !c.condition || c.condition());
  filtered.forEach((choice, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = `${i + 1}. ${choice.text}`;
    btn.onclick = () => makeChoice(choice);
    choicesPanel.appendChild(btn);
  });
}

function makeChoice(choice) {
  if (choice.flags) {
    Object.assign(state.flags, choice.flags);
  }
  if (choice.onChoose) {
    choice.onChoose(state.player);
  }
  if (choice.next === '_title') {
    location.reload();
    return;
  }
  loadScene(choice.next);
}

function updateHud() {
  const p = state.player;
  if (!p) return;
  document.getElementById('hud').classList.add('active');
  document.getElementById('hud-hp').style.width = `${(p.hp / p.maxHp) * 100}%`;
  document.getElementById('hud-hp-text').textContent = `${p.hp}/${p.maxHp}`;
  document.getElementById('hud-mp').style.width = `${(p.mp / p.maxMp) * 100}%`;
  document.getElementById('hud-mp-text').textContent = `${p.mp}/${p.maxMp}`;
  document.getElementById('hud-lv').textContent = p.level;
  document.getElementById('hud-xp').style.width = `${(p.exp / p.expNext) * 100}%`;
  document.getElementById('hud-gold').textContent = p.gold;
}

// ============================================================
// SCENE MANAGEMENT
// ============================================================
async function loadScene(sceneId) {
  const scene = SCENES[sceneId];
  if (!scene) {
    addTextLine('system', `[Scene "${sceneId}" not yet implemented]`);
    return;
  }

  state.scene = sceneId;
  clearText();
  choicesPanel.innerHTML = '';

  if (scene.art) {
    drawScene(artCtx, artCanvas.width, artCanvas.height, scene.art);
  }

  if (scene.onEnter) {
    scene.onEnter(state.player);
  }

  const textLines = state.textQueue.length > 0 ? state.textQueue : scene.text;
  state.textQueue = [];

  await typeText(textLines);
  updateHud();

  if (scene.combat) {
    await sleep(400);
    startCombat(scene.combat, scene.onVictory, scene.onFlee);
  } else if (scene.choices) {
    showChoices(scene.choices);
  }
}

// ============================================================
// COMBAT SYSTEM
// ============================================================
function createEnemy(enemyId) {
  const template = ENEMIES[enemyId];
  return {
    ...template,
    maxHp: template.hp,
    id: enemyId + '_' + Math.random().toString(36).substr(2, 4),
    buffs: [],
  };
}

async function startCombat(config, onVictory, onFlee) {
  const enemies = config.enemies.map(id => {
    const e = createEnemy(id);
    if (config.preModify) {
      const mods = config.preModify();
      if (mods.defMod) e.def += mods.defMod;
      if (mods.hpMod) { e.hp += mods.hpMod; e.maxHp += mods.hpMod; }
    }
    if (config.bossName) e.name = config.bossName;
    return e;
  });

  state.combat = {
    enemies,
    turn: 'player',
    onVictory,
    onFlee,
    canFlee: config.canFlee,
    round: 1,
    log: [],
  };

  drawCombatScene(artCtx, artCanvas.width, artCanvas.height, enemies, state.player);
  addTextLine('combat', '═══ BATTLE START ═══');
  showCombatActions();
}

function showCombatActions() {
  choicesPanel.innerHTML = '';
  const actDiv = document.createElement('div');
  actDiv.id = 'combat-actions';

  state.player.abilities.forEach(ability => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn combat-btn';
    const costText = ability.cost > 0 ? ` [${ability.cost} MP]` : '';
    btn.textContent = `${ability.name}${costText}`;
    btn.title = ability.desc;
    if (ability.cost > state.player.mp) {
      btn.style.opacity = '0.4';
      btn.style.cursor = 'not-allowed';
    } else {
      btn.onclick = () => playerAction(ability);
    }
    actDiv.appendChild(btn);
  });

  const itemBtn = document.createElement('button');
  itemBtn.className = 'choice-btn combat-btn';
  itemBtn.textContent = 'Item';
  itemBtn.onclick = showCombatItems;
  actDiv.appendChild(itemBtn);

  if (state.combat.canFlee) {
    const fleeBtn = document.createElement('button');
    fleeBtn.className = 'choice-btn combat-btn';
    fleeBtn.textContent = 'Flee';
    fleeBtn.onclick = attemptFlee;
    actDiv.appendChild(fleeBtn);
  }

  choicesPanel.appendChild(actDiv);
}

function showCombatItems() {
  choicesPanel.innerHTML = '';
  const p = state.player;
  const usable = Object.entries(p.inventory).filter(([id]) => {
    const item = ITEMS[id];
    return item && (item.type === 'heal' || item.type === 'mana' || item.type === 'full' || item.type === 'cure');
  });

  if (usable.length === 0) {
    addTextLine('system', 'No usable items!');
    showCombatActions();
    return;
  }

  usable.forEach(([id, qty]) => {
    const item = ITEMS[id];
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = `${item.name} (${qty}) - ${item.desc}`;
    btn.onclick = () => useItem(id);
    choicesPanel.appendChild(btn);
  });

  const backBtn = document.createElement('button');
  backBtn.className = 'choice-btn';
  backBtn.textContent = 'Back';
  backBtn.onclick = showCombatActions;
  choicesPanel.appendChild(backBtn);
}

async function useItem(itemId) {
  const item = ITEMS[itemId];
  const p = state.player;
  removeItem(p, itemId, 1);

  switch(item.type) {
    case 'heal':
      p.hp = Math.min(p.maxHp, p.hp + item.value);
      addTextLine('system', `Used ${item.name}! Restored ${item.value} HP.`);
      break;
    case 'mana':
      p.mp = Math.min(p.maxMp, p.mp + item.value);
      addTextLine('system', `Used ${item.name}! Restored ${item.value} MP.`);
      break;
    case 'full':
      p.hp = p.maxHp;
      p.mp = p.maxMp;
      addTextLine('system', `Used ${item.name}! Fully restored!`);
      break;
    case 'cure':
      p.buffs = p.buffs.filter(b => b.type !== 'poison');
      addTextLine('system', `Used ${item.name}! Cured poison.`);
      break;
  }

  updateHud();
  await sleep(500);
  await enemyTurn();
}

async function playerAction(ability) {
  const p = state.player;
  const combat = state.combat;

  if (ability.cost > p.mp) {
    addTextLine('system', 'Not enough MP!');
    return;
  }

  choicesPanel.innerHTML = '';
  p.mp -= ability.cost;

  if (ability.type === 'buff') {
    handleBuff(p, ability);
  } else {
    const targets = ability.aoe ? combat.enemies.filter(e => e.hp > 0) : [combat.enemies.find(e => e.hp > 0)];

    for (const target of targets) {
      if (!target || target.hp <= 0) continue;

      const isMagic = ability.type === 'magic';
      const atkStat = isMagic ? p.mag : p.atk;
      const atkBuff = p.buffs.find(b => b.type === 'atkUp');
      const totalAtk = atkStat * ability.power * (atkBuff ? 1.3 : 1);

      const defDown = target.buffs.find(b => b.type === 'defDown');
      const totalDef = Math.max(0, target.def * (defDown ? 0.6 : 1));

      let damage = Math.max(1, Math.floor(totalAtk - totalDef * 0.5 + (Math.random() * 4 - 2)));

      const critChance = ability.name === 'Backstab' ? 0.4 : 0.1;
      const isCrit = Math.random() < critChance;
      if (isCrit) damage = Math.floor(damage * 1.8);

      target.hp = Math.max(0, target.hp - damage);

      const critText = isCrit ? ' CRITICAL!' : '';
      addTextLine('combat', `${p.name} uses ${ability.name} on ${target.name}! ${damage} damage!${critText}`);

      if (ability.effect) {
        applyEffect(target, ability.effect);
      }

      showDamageNumber(damage, isCrit, true);
      shakeScreen();

      if (target.hp <= 0) {
        addTextLine('combat', `${target.name} is defeated!`);
      }
    }
  }

  updateHud();
  drawCombatScene(artCtx, artCanvas.width, artCanvas.height, combat.enemies, p);

  processBurnTicks(p);

  if (combat.enemies.every(e => e.hp <= 0)) {
    await sleep(600);
    await combatVictory();
    return;
  }

  await sleep(600);
  await enemyTurn();
}

function handleBuff(entity, ability) {
  const existing = entity.buffs.findIndex(b => b.type === ability.effect);
  if (existing >= 0) entity.buffs.splice(existing, 1);
  entity.buffs.push({ type: ability.effect, turns: 3 });
  addTextLine('system', `${entity.name} activates ${ability.name}!`);
}

function applyEffect(target, effect) {
  switch(effect) {
    case 'defDown':
      target.buffs.push({ type: 'defDown', turns: 3 });
      addTextLine('system', `${target.name}'s defense is lowered!`);
      break;
    case 'spdDown':
      target.buffs.push({ type: 'spdDown', turns: 3 });
      addTextLine('system', `${target.name} is slowed!`);
      break;
    case 'poison':
      target.buffs.push({ type: 'poison', turns: 3, damage: 5 });
      addTextLine('system', `${target.name} is poisoned!`);
      break;
  }
}

function processBurnTicks(entity) {
  entity.buffs = entity.buffs.filter(b => {
    if (b.type === 'poison' && b.damage) {
      entity.hp = Math.max(0, entity.hp - b.damage);
      addTextLine('combat', `${entity.name} takes ${b.damage} poison damage!`);
    }
    b.turns--;
    if (b.turns <= 0) {
      addTextLine('system', `${entity.name}'s ${b.type} effect wore off.`);
      return false;
    }
    return true;
  });
}

async function enemyTurn() {
  const combat = state.combat;
  const p = state.player;

  for (const enemy of combat.enemies) {
    if (enemy.hp <= 0) continue;

    processBurnTicks(enemy);
    if (enemy.hp <= 0) {
      addTextLine('combat', `${enemy.name} succumbs to poison!`);
      continue;
    }

    await sleep(400);

    const ability = enemy.abilities[Math.floor(Math.random() * enemy.abilities.length)];

    if (ability.type === 'buff') {
      handleBuff(enemy, ability);
    } else {
      const evasion = p.buffs.find(b => b.type === 'evasion');
      if (evasion && Math.random() < 0.4) {
        addTextLine('combat', `${enemy.name} attacks but ${p.name} dodges!`);
        continue;
      }

      const isMagic = ability.type === 'magic';
      const atkStat = isMagic ? (enemy.mag || enemy.atk) : enemy.atk;
      const atkBuff = enemy.buffs.find(b => b.type === 'atkUp');
      const totalAtk = atkStat * (ability.power || 1.0) * (atkBuff ? 1.3 : 1);
      const totalDef = p.def * 0.5;
      let damage = Math.max(1, Math.floor(totalAtk - totalDef + (Math.random() * 3 - 1)));

      p.hp = Math.max(0, p.hp - damage);
      addTextLine('combat', `${enemy.name} uses ${ability.name}! ${damage} damage to ${p.name}!`);
      showDamageNumber(damage, false, false);
      shakeScreen();
    }
  }

  processBurnTicks(p);
  updateHud();
  drawCombatScene(artCtx, artCanvas.width, artCanvas.height, combat.enemies, p);

  if (p.hp <= 0) {
    await sleep(600);
    addTextLine('combat', `${p.name} falls in battle...`);
    addTextLine('system', 'GAME OVER');
    choicesPanel.innerHTML = '';
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = 'Return to Title';
    btn.onclick = () => location.reload();
    choicesPanel.appendChild(btn);
    return;
  }

  if (combat.enemies.every(e => e.hp <= 0)) {
    await sleep(600);
    await combatVictory();
    return;
  }

  combat.round++;
  showCombatActions();
}

async function combatVictory() {
  const combat = state.combat;
  const p = state.player;

  let totalExp = 0, totalGold = 0;
  combat.enemies.forEach(e => {
    const template = Object.values(ENEMIES).find(t => t.name === e.name) || e;
    totalExp += template.exp || e.exp || 10;
    totalGold += template.gold || e.gold || 5;
  });

  p.exp += totalExp;
  p.gold += totalGold;

  addTextLine('system', '═══ VICTORY ═══');
  addTextLine('loot', `Gained ${totalExp} EXP, ${totalGold} Gold`);

  checkLevelUp(p);
  p.buffs = [];
  state.combat = null;

  updateHud();
  await sleep(800);

  if (combat.onVictory) {
    loadScene(combat.onVictory);
  }
}

async function attemptFlee() {
  const combat = state.combat;
  const p = state.player;
  const fleeChance = 0.4 + (p.spd / 40);

  if (Math.random() < fleeChance) {
    addTextLine('system', 'Got away safely!');
    state.combat = null;
    p.buffs = [];
    await sleep(600);
    if (combat.onFlee) loadScene(combat.onFlee);
  } else {
    addTextLine('system', 'Couldn\'t escape!');
    await sleep(400);
    await enemyTurn();
  }
}

function showDamageNumber(damage, isCrit, isPlayer) {
  const artPanel = document.getElementById('art-panel');
  const num = document.createElement('div');
  num.className = 'damage-number';
  num.textContent = damage;
  num.style.color = isCrit ? '#C9A84C' : (isPlayer ? '#C4B9A7' : '#A63D3D');
  num.style.fontSize = isCrit ? '18px' : '14px';
  num.style.left = isPlayer ? '500px' : '120px';
  num.style.top = '100px';
  artPanel.appendChild(num);
  setTimeout(() => num.remove(), 1000);
}

function shakeScreen() {
  const container = document.getElementById('game-container');
  container.classList.add('shake');
  setTimeout(() => container.classList.remove('shake'), 300);
}

function openInventory() {
  const overlay = document.getElementById('inventory-overlay');
  const grid = document.getElementById('inv-grid');
  grid.innerHTML = '';

  const p = state.player;
  Object.entries(p.inventory).forEach(([id, qty]) => {
    const item = ITEMS[id];
    if (!item) return;
    const slot = document.createElement('div');
    slot.className = 'inv-slot';
    slot.innerHTML = `<span class="item-name">${item.name}</span><span class="item-desc">${item.desc}</span><span class="item-qty">x${qty}</span>`;
    grid.appendChild(slot);
  });

  if (Object.keys(p.inventory).length === 0) {
    const slot = document.createElement('div');
    slot.className = 'inv-slot';
    slot.innerHTML = '<span class="item-desc">Empty</span>';
    grid.appendChild(slot);
  }

  overlay.classList.add('active');
}

function closeInventory() {
  document.getElementById('inventory-overlay').classList.remove('active');
}

// ============================================================
// INITIALIZATION
// ============================================================
function init() {
  drawTitleArt(document.getElementById('title-art'));
}

function startNewGame() {
  document.getElementById('title-screen').style.display = 'none';
  document.getElementById('char-create').style.display = 'flex';
  buildClassSelection();
}

function buildClassSelection() {
  const grid = document.getElementById('class-grid');
  grid.innerHTML = '';

  Object.entries(CLASSES).forEach(([id, cls]) => {
    const card = document.createElement('div');
    card.className = 'class-card';
    card.dataset.cls = id;

    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    drawSprite(ctx, SPRITES[id], 8, 0, 3);

    card.appendChild(canvas);
    card.innerHTML += `
      <h3>${cls.name}</h3>
      <p>${cls.desc}</p>
      <div class="class-stats">
        HP: ${cls.hp} | MP: ${cls.mp}<br>
        ATK: ${cls.atk} | DEF: ${cls.def}<br>
        SPD: ${cls.spd} | MAG: ${cls.mag}
      </div>
    `;
    card.prepend(canvas);

    card.onclick = () => {
      grid.querySelectorAll('.class-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      state.selectedClass = id;
      document.getElementById('begin-btn').style.display = 'block';
    };

    grid.appendChild(card);
  });
}

function beginAdventure() {
  const name = document.getElementById('name-input').value.trim() || 'Hero';
  const cls = state.selectedClass;
  if (!cls) return;

  state.player = createPlayer(name, cls);
  document.getElementById('char-create').style.display = 'none';
  loadScene('intro');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'i' || e.key === 'I') {
    if (state.player && !state.combat) {
      const overlay = document.getElementById('inventory-overlay');
      if (overlay.classList.contains('active')) closeInventory();
      else openInventory();
    }
  }

  if (e.key >= '1' && e.key <= '9') {
    const btns = choicesPanel.querySelectorAll('.choice-btn');
    const idx = parseInt(e.key) - 1;
    if (btns[idx]) btns[idx].click();
  }
});

init();
</script>
