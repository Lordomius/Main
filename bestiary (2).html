    --text-light:#e8eaec;--text-light-secondary:#8a929e;--crimson-bright:#f0cf5a;
    --accent-glow:rgba(201,162,39,0.2);--accent-glow-crit:rgba(201,162,39,0.22);
    --fumble-bg:rgba(224,63,63,0.20);--fumble-color:#ff6b6b;--btn-primary-hover:#2e3440;
    --card-border-width:4px;--card-border-style:double;
  }
  :root[data-theme="silver"]{
    --ink:#e6e8ec;--parchment:#eff1f5;--parchment-dark:#18191c;--parchment-darker:#80848e;
    --forest:#525a68;--forest-dark:#3a4250;--forest-light:#485060;
    --crimson:#282e38;--crimson-light:#363e4c;
    --gold:#7888a0;--gold-light:#a0b4cc;
    --desk:#06070a;--desk-light:#0e1014;
    --card-bg:#121418;--card-bg-alt:#1c1e24;--card-bg-alt-hover:#282c34;
    --text-light:#e6e8ec;--text-light-secondary:#848c9a;--crimson-bright:#a0b4cc;
    --accent-glow:rgba(120,136,160,0.2);--accent-glow-crit:rgba(120,136,160,0.22);
    --fumble-bg:rgba(224,63,63,0.20);--fumble-color:#ff6b6b;--btn-primary-hover:#262c36;
    --card-border-width:3px;--card-border-style:solid;
  }
  :root[data-theme="ember"]{
    --ink:#f0e0dc;--parchment:#fbece8;--parchment-dark:#231814;--parchment-darker:#916a5b;
    --forest:#93522b;--forest-dark:#683a1f;--forest-light:#70503a;
    --crimson:#542a16;--crimson-light:#72381f;
    --gold:#d8864f;--gold-light:#ffb88f;
    --desk:#0b0705;--desk-light:#18100d;
    --card-bg:#1c1410;--card-bg-alt:#2c201a;--card-bg-alt-hover:#3c2e24;
    --text-light:#f0e0dc;--text-light-secondary:#af8b7f;--crimson-bright:#ffb88f;
    --accent-glow:rgba(216,134,79,0.2);--accent-glow-crit:rgba(216,134,79,0.22);
    --fumble-bg:rgba(224,63,63,0.20);--fumble-color:#ff6b6b;--btn-primary-hover:#4a2814;
    --card-border-width:3px;--card-border-style:solid;
  }
  *{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--forest-light) var(--desk-light);}
  *::-webkit-scrollbar{width:10px;height:10px;}
  *::-webkit-scrollbar-track{background:var(--desk-light);}
  *::-webkit-scrollbar-thumb{background:var(--forest-light);border-radius:6px;border:2px solid var(--desk-light);}
  *::-webkit-scrollbar-thumb:hover{background:var(--gold);}
  *::-webkit-scrollbar-corner{background:var(--desk-light);}
  html,body{margin:0;padding:0;height:100vh;overflow:hidden;background:var(--desk);color:var(--ink);font-family:var(--font-body);}
  body{
    display:flex;flex-direction:column;
    background-image:var(--app-bg-image, none);
    background-size:cover;background-position:center;background-repeat:no-repeat;
  }

  .toolbar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--desk-light);
    padding:12px 18px;
    border-bottom:2px solid var(--gold);
  }
  .toolbar h1{
    font-family:var(--font-display);font-weight:normal;font-size:24px;
    color:var(--gold-light);letter-spacing:0.5px;margin:0 18px 0 0;
  }
  .toolbar .spacer{flex:1;}
  button{
    font-family:var(--font-body);cursor:pointer;
  }
  .tb-btn{
    background:transparent;border:1px solid var(--forest-light);color:var(--parchment);
    padding:7px 14px;border-radius:3px;font-size:15px;letter-spacing:0.3px;
    transition:background .15s;
  }
  .tb-btn:hover{background:var(--forest-dark);}
  .tb-btn.primary{border-color:var(--gold);color:var(--gold-light);}
  .tb-btn.primary:hover{background:var(--btn-primary-hover);}
  .mode-toggle{display:flex;border:1px solid var(--forest-light);border-radius:3px;overflow:hidden;}
  .mode-toggle button{
    background:transparent;border:none;color:var(--parchment);padding:7px 12px;font-size:14px;
  }
  .mode-toggle button.active{background:var(--forest);color:#fff;}
  #fileImportInput,#mdImportInput,#imageUploadInput,#bgImageInput{display:none;}

  .settings-btn{
    background:transparent;border:1px solid var(--forest-light);color:var(--parchment);
    width:38px;height:38px;border-radius:3px;font-size:19px;line-height:1;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:background .15s,transform .3s;
  }
  .settings-btn:hover{background:var(--forest-dark);}
  .settings-btn.open{background:var(--forest);color:#fff;transform:rotate(35deg);}

  .settings-panel{
    position:absolute;top:56px;left:14px;width:280px;
    background:var(--desk-light);border:2px solid var(--gold);border-radius:8px;
    box-shadow:0 10px 30px rgba(0,0,0,0.6);padding:16px;z-index:400;
    display:none;font-family:var(--font-body);
  }
  .settings-panel.open{display:block;}
  .settings-panel h3{margin:0 0 4px;font-size:14px;color:var(--gold-light);font-family:var(--font-display);letter-spacing:0.3px;}
  .settings-panel .settings-sub{margin:0 0 10px;font-size:12px;color:var(--text-light-secondary);}
  .theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
  .theme-swatch{
    width:100%;aspect-ratio:1;border-radius:6px;border:2px solid var(--forest-light);
    cursor:pointer;position:relative;overflow:hidden;padding:0;
  }
  .theme-swatch:hover{border-color:var(--gold);}
  .theme-swatch.active{border-color:var(--gold-light);box-shadow:0 0 0 2px var(--gold-light);}
  .theme-swatch .ts-check{
    position:absolute;top:2px;right:2px;color:#fff;font-size:11px;font-weight:bold;
    text-shadow:0 0 3px rgba(0,0,0,0.9);display:none;
  }
  .theme-swatch.active .ts-check{display:block;}
  .theme-swatch-label{
    position:absolute;bottom:0;left:0;right:0;font-size:8.5px;text-align:center;
    color:#fff;background:rgba(0,0,0,0.55);padding:1px 0;letter-spacing:0.2px;
  }
  .settings-divider{height:1px;background:var(--forest-light);margin:12px 0;}
  .settings-row-label{font-size:12px;color:var(--text-light-secondary);margin-bottom:6px;}
  .settings-btn-full{
    width:100%;background:transparent;border:1px solid var(--forest-light);color:var(--parchment);
    padding:7px 10px;border-radius:3px;font-size:13px;margin-top:6px;
  }
  .settings-btn-full:hover{background:var(--forest-dark);}

  .layout{display:flex;flex:1;min-height:0;}

  .catalog{
    width:230px;flex-shrink:0;background:var(--desk-light);
    border-right:2px solid var(--gold);
    overflow-y:auto;padding:14px 10px;
  }
  .cat-search{
    width:100%;padding:7px 9px;border-radius:3px;border:1px solid var(--forest-light);
    background:var(--desk);color:var(--parchment);font-size:15px;margin-bottom:12px;
  }
  .cat-card{
    position:relative;background:var(--parchment-dark);color:var(--ink);
    padding:10px 12px 9px;margin-bottom:8px;cursor:pointer;
    border-radius:2px 2px 0 0;
    clip-path:polygon(0 0, 82% 0, 100% 35%, 100% 100%, 0 100%);

  .cat-card:hover{transform:translateX(2px);}
  .cat-card.selected{background:var(--forest);border-color:var(--gold);}
  .cat-card .cc-name{font-size:16px;font-weight:bold;}
  .cat-card .cc-meta{font-size:13px;color:var(--forest-dark);font-family:var(--font-body);margin-top:2px;}
  .cat-empty{color:var(--parchment-darker);font-size:14px;padding:14px 4px;line-height:1.5;}

  .stage{flex:1;overflow-y:auto;padding:24px;display:flex;justify-content:center;position:relative;}
  .stage-inner{max-width:720px;width:100%;position:relative;z-index:1;}

  .empty-state{
    color:var(--parchment-darker);text-align:center;margin-top:80px;font-family:var(--font-display);
  }
  .empty-state .big{font-size:26px;color:var(--gold-light);margin-bottom:8px;}

  .sb-card{
    background:var(--card-bg);color:var(--text-light);border:var(--card-border-width) var(--card-border-style) var(--gold);border-radius:4px;
    padding:20px 24px;box-shadow:0 6px 18px rgba(0,0,0,0.6);
    position:relative;z-index:1;
  }
  .sb-topbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:6px;}
  .sb-topbar button{
    background:transparent;border:1px solid var(--forest-light);color:var(--text-light-secondary);
    padding:4px 10px;border-radius:3px;font-size:13.5px;
  }
  .sb-topbar button:hover{background:var(--forest);color:#fff;}
  .sb-topbar button.danger{border-color:var(--crimson-light);color:var(--crimson-bright);}
  .sb-topbar button.danger:hover{background:var(--crimson);color:#fff;}

  .sb-head{display:flex;gap:16px;align-items:flex-start;border-bottom:2px solid var(--crimson);padding-bottom:10px;margin-bottom:10px;}
  .sb-portrait{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);flex-shrink:0;background:var(--card-bg-alt);}
  .sb-name{font-family:var(--font-name);font-variant:small-caps;letter-spacing:0.5px;font-size:32px;color:var(--crimson-bright);margin:0;}
  .sb-sub{font-style:italic;font-size:15px;color:var(--text-light-secondary);margin:2px 0 0;}
  .sb-cr{margin-left:auto;text-align:right;font-size:14px;color:var(--text-light-secondary);white-space:nowrap;}
  .sb-cr b{display:block;font-family:var(--font-display);font-size:24px;color:var(--gold-light);}

  .sb-core{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px;font-size:15.5px;}
  .sb-core div b{color:var(--gold-light);}

  .sb-divider{height:2px;background:linear-gradient(to right, var(--crimson), transparent);margin:10px 0;}

  .ability-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px;}
  .ability-box{
    background:var(--card-bg-alt);border:1px solid var(--forest-light);border-radius:4px;
    text-align:center;padding:8px 2px;cursor:pointer;transition:background .12s, transform .08s;
  }
  .ability-box:hover{background:var(--card-bg-alt-hover);border-color:var(--gold);}
  .ability-box:active{transform:scale(0.96);}
  .save-box.proficient{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);}
  .prof-dot{color:var(--gold-light);font-size:10px;vertical-align:middle;margin-left:2px;}
  .ab-name{font-size:13px;letter-spacing:1px;color:var(--text-light-secondary);font-weight:bold;}
  .ab-score{font-family:var(--font-display);font-size:21px;margin:2px 0;color:var(--text-light);}
  .ab-mod{font-size:14px;font-family:var(--font-mono);color:var(--crimson-bright);}

  .pillrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .pill{
    background:var(--card-bg-alt);border:1px solid var(--forest-light);color:var(--text-light);border-radius:14px;
    padding:5px 12px;font-size:14.5px;cursor:pointer;transition:background .12s;
  }
  .pill:hover{background:var(--card-bg-alt-hover);border-color:var(--gold);}
  .pill:active{transform:scale(0.96);}

  .sb-line{font-size:15px;margin:4px 0;}
  .sb-line b{color:var(--gold-light);}

  .trait{margin:9px 0;font-size:15.5px;line-height:1.5;}
  .trait b{font-style:italic;color:var(--gold-light);}
  .trait i{font-style:italic;}

  .action-row{margin:10px 0;font-size:15.5px;line-height:1.55;}
  .action-row .a-name{font-style:italic;font-weight:bold;color:var(--crimson-bright);}
  .action-rolls{margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;}
  .stamp{
    background:var(--forest);color:#fff;border:none;border-radius:20px;
    padding:6px 14px;font-size:14.5px;font-family:var(--font-mono);cursor:pointer;
    transition:transform .08s;
  }
  .stamp:active{transform:scale(0.9) rotate(-3deg);}
  .stamp.dmg{background:var(--crimson);}
  .stamp:hover{filter:brightness(1.25);}

  .section-title{
    font-family:var(--font-display);font-size:18px;color:var(--gold-light);
    border-bottom:1px solid var(--forest-light);padding-bottom:2px;margin:14px 0 8px;
  }

  .rolllog{
    position:fixed;right:20px;bottom:20px;width:360px;height:300px;
    background:var(--desk-light);border:2px solid var(--gold);border-radius:8px;
    box-shadow:0 10px 30px rgba(0,0,0,0.6);
    display:flex;flex-direction:column;overflow:hidden;
    font-family:var(--font-mono);font-size:14.5px;z-index:200;
  }
  .rolllog-resize{
    position:absolute;right:0;bottom:0;width:20px;height:20px;
    cursor:nwse-resize;touch-action:none;
    background:linear-gradient(135deg, transparent 0 50%, var(--gold) 50% 58%, transparent 58% 66%, var(--gold) 66% 74%, transparent 74% 82%, var(--gold) 82% 90%, transparent 90% 100%);
  }
  .spellwin{
    position:fixed;left:20px;top:80px;width:380px;height:340px;
    background:var(--desk-light);border:2px solid var(--gold);border-radius:8px;
    box-shadow:0 10px 30px rgba(0,0,0,0.6);
    display:flex;flex-direction:column;overflow:hidden;
    font-size:15px;z-index:210;
  }
  .spellwin-head{
    display:flex;justify-content:space-between;align-items:center;color:var(--gold-light);
    padding:8px 12px;background:var(--card-bg-alt);border-bottom:1px solid var(--forest-light);
    cursor:move;user-select:none;flex-shrink:0;touch-action:none;
  }
  .spellwin-head button{background:none;border:1px solid var(--forest-light);color:var(--parchment);border-radius:3px;padding:2px 8px;font-size:13px;cursor:pointer;}
  .spellwin-body{overflow-y:auto;padding:10px 14px;flex:1;}
  .spell-level-line{font-weight:bold;color:var(--gold-light);font-size:16px;margin-bottom:8px;}
  .spell-stats{display:grid;grid-template-columns:120px 1fr;row-gap:6px;column-gap:8px;margin:8px 0 12px;padding:10px;background:var(--card-bg-alt);border:1px solid var(--forest-light);border-radius:6px;}
  .ss-label{color:var(--gold-light);font-weight:bold;font-size:14px;}
  .ss-val{color:var(--text-light);font-size:15px;}
  .spell-save{margin:8px 0;font-weight:bold;color:var(--gold-light);font-size:16px;}
  .spell-desc{margin:8px 0;line-height:1.6;}
  .spell-link{color:var(--gold-light);cursor:pointer;font-weight:bold;}
  .num-highlight{color:var(--gold-light);font-weight:bold;background:var(--accent-glow);border-radius:3px;padding:0 3px;}
  .spell-link:hover{color:#fff;}
  .cast-freq{display:inline-block;margin-top:6px;}
  .rolllog-head{
    display:flex;justify-content:space-between;align-items:center;color:var(--gold-light);
    padding:8px 12px;background:var(--card-bg-alt);border-bottom:1px solid var(--forest-light);
    cursor:move;user-select:none;flex-shrink:0;touch-action:none;
  }
  .rolllog-head button{background:none;border:1px solid var(--forest-light);color:var(--parchment);border-radius:3px;padding:2px 8px;font-size:13px;}
  .rolllog-head > div{display:flex;gap:6px;}
  #logList{overflow-y:auto;padding:8px 12px;flex:1;}
  .log-entry{color:var(--parchment);padding:2px 4px;border-bottom:1px solid #16202a;border-radius:3px;}
  .log-entry.crit{background:var(--accent-glow-crit);border-left:3px solid var(--gold-light);padding-left:6px;}
  .log-entry.fumble{background:var(--fumble-bg);border-left:3px solid var(--fumble-color);padding-left:6px;}
  .log-entry .tag-crit{color:var(--gold-light);font-weight:bold;}
  .log-entry .tag-fumble{color:var(--fumble-color);font-weight:bold;}
  .log-entry .total{color:#fff;font-weight:bold;}
  .log-entry.crit .hl{color:var(--gold-light);font-weight:bold;}
  .log-entry.fumble .hl{color:var(--fumble-color);font-weight:bold;}
  .log-empty{color:#4d6478;font-style:italic;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;
    z-index:50;padding:20px;
  }
  .confirm-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.65);display:flex;align-items:center;justify-content:center;
    z-index:300;padding:20px;
  }

  .drop-overlay{
    position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,0.7);border:4px dashed var(--gold);pointer-events:none;
  }
  .drop-overlay.active{display:flex;}
  .drop-overlay-inner{
    font-family:var(--font-display);font-size:26px;color:var(--gold-light);
    padding:26px 46px;border:2px solid var(--gold);border-radius:10px;background:var(--card-bg);
    text-align:center;
  }
  .confirm-box{
    background:var(--card-bg);border:3px solid var(--gold);border-radius:6px;
    max-width:400px;width:100%;padding:20px 24px;box-shadow:0 10px 30px rgba(0,0,0,0.6);
  }
  .confirm-box p{margin:0 0 16px;color:var(--text-light);font-size:16px;line-height:1.5;}
  .confirm-actions{display:flex;justify-content:flex-end;gap:10px;}
  .confirm-actions button{padding:8px 18px;border-radius:4px;font-size:15.5px;border:none;cursor:pointer;}
  .confirm-actions .cancel{background:transparent;border:1px solid var(--forest-light);color:var(--text-light-secondary);}
  .confirm-actions .danger{background:var(--crimson);color:#fff;}
  .modal{
    background:var(--card-bg);border:3px solid var(--gold);border-radius:5px;
    width:100%;max-width:640px;max-height:88vh;overflow-y:auto;padding:20px 24px;
  }
  .modal h2{font-family:var(--font-display);color:var(--gold-light);margin-top:0;}
  .f-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .f-field{flex:1;min-width:110px;display:flex;flex-direction:column;gap:3px;}
  .f-field label{font-size:13.5px;color:var(--gold-light);font-weight:bold;letter-spacing:0.3px;}
  .f-field input,.f-field select,.f-field textarea{
    padding:6px 8px;border:1px solid var(--parchment-darker);border-radius:3px;background:var(--card-bg-alt);color:var(--text-light);
    font-family:var(--font-body);font-size:15px;
  }
  .f-field textarea{resize:vertical;min-height:44px;}
  .list-block{border:1px solid var(--parchment-darker);border-radius:4px;padding:10px;margin-bottom:12px;background:var(--desk-light);}
  .list-block-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .list-block-head span{font-weight:bold;color:var(--gold-light);font-size:15px;}
  .list-row{display:flex;gap:6px;margin-bottom:6px;align-items:flex-start;flex-wrap:wrap;}
  .list-row input,.list-row textarea{flex:1;min-width:80px;padding:5px 7px;border:1px solid var(--parchment-darker);border-radius:3px;font-size:14.5px;font-family:var(--font-body);background:var(--card-bg-alt);color:var(--text-light);}
  .list-row .rm{background:var(--crimson);color:#fff;border:none;border-radius:3px;padding:0 8px;font-size:15px;cursor:pointer;}
  .add-row-btn{background:var(--forest);color:#fff;border:none;border-radius:3px;padding:5px 10px;font-size:14px;cursor:pointer;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;border-top:1px solid var(--parchment-darker);padding-top:14px;}
  .modal-actions button{padding:8px 18px;border-radius:4px;font-size:15.5px;border:none;cursor:pointer;}
  .modal-actions .cancel{background:transparent;border:1px solid var(--forest-light);color:var(--text-light-secondary);}
  .modal-actions .save{background:var(--forest);color:#fff;}
  .img-upload-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .img-preview{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:var(--parchment-dark);}
  .small-btn{background:transparent;border:1px solid var(--forest-light);color:var(--text-light-secondary);border-radius:3px;padding:5px 10px;font-size:14px;cursor:pointer;}

  @media (max-width: 700px){
    .layout{flex-direction:column;}
    .catalog{width:100%;max-height:180px;}
    .ability-grid{grid-template-columns:repeat(3,1fr);}
  }
</style>

<body>

<div class="toolbar">
  <button class="settings-btn" id="settingsBtn" data-action="toggle-settings" title="Settings">⚙</button>
  <h1>Bestiary</h1>
  <button class="tb-btn primary" data-action="new-monster">+ New monster</button>
  <button class="tb-btn" data-action="trigger-import">Import JSON</button>
  <button class="tb-btn" data-action="trigger-import-md">Import Markdown</button>
  <button class="tb-btn" data-action="export-all">Export library</button>
  <div class="spacer"></div>
  <div class="mode-toggle" id="modeToggle">
    <button data-mode="normal" class="active">Normal</button>
    <button data-mode="adv">Advantage</button>
    <button data-mode="dis">Disadvantage</button>
  </div>
</div>
<div class="settings-panel" id="settingsPanel">
  <h3>Color palette</h3>
  <p class="settings-sub">Choose a theme for the bestiary.</p>

  function uid(){ return 'm_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function abilityMod(score){ return Math.floor((score - 10) / 2); }
  function fmt(n){ n = Math.round(n); return (n >= 0 ? '+' : '') + n; }
  function esc(s){
    if(s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  function rollDie(sides){ return 1 + Math.floor(Math.random() * sides); }

  function rollD20(bonus, label){
    var mode = state.mode;
    var r1 = rollDie(20);
    var r2 = null, chosen = r1;
    if(mode === 'adv'){ r2 = rollDie(20); chosen = Math.max(r1, r2); }
    else if(mode === 'dis'){ r2 = rollDie(20); chosen = Math.min(r1, r2); }
    var total = chosen + bonus;
    var isCrit = chosen === 20;
    var isFumble = chosen === 1;
    var chosenDisplay = (isCrit || isFumble) ? ('<span class="hl">' + chosen + '</span>') : ('' + chosen);
    var rollsTxt = r2 === null ? chosenDisplay : (r1 + ',' + r2 + ' \u2192 ' + chosenDisplay);
    addLog(label, rollsTxt + ' ' + fmt(bonus), total, isCrit, isFumble);
  }

  function rollDamage(expr, label, typeLabel){
    var parts = String(expr).split('+').map(function(s){ return s.trim(); }).filter(Boolean);
    var total = 0;
    var breakdown = [];
    parts.forEach(function(p){
      var m = p.match(/^(\d+)d(\d+)$/i);
      if(m){
        var n = parseInt(m[1], 10), s = parseInt(m[2], 10);
        var rolls = [];
        for(var i = 0; i < n; i++) rolls.push(rollDie(s));
        var sum = rolls.reduce(function(a,b){ return a + b; }, 0);
        total += sum;
        breakdown.push(p + '(' + rolls.join('+') + ')');
      } else if(/^\d+$/.test(p)){
        total += parseInt(p, 10);
        breakdown.push(p);
      }
    });
    var suffix = typeLabel ? (' ' + typeLabel) : '';
    addLog(label, breakdown.join(' + ') || expr, total, false, false, suffix);
  }

  function addLog(label, detail, total, isCrit, isFumble, suffix){
    var key = state.currentId || '__unassigned__';
    if(!state.logs[key]) state.logs[key] = [];
    state.logs[key].unshift({label:label, detail:detail, total:total, isCrit:!!isCrit, isFumble:!!isFumble, suffix:suffix||''});
    if(state.logs[key].length > 60) state.logs[key].pop();
    renderLog();
    var panel = document.getElementById('rolllogPanel');
    if(panel.style.display === 'none') panel.style.display = 'flex';
  }

  function renderLog(){
    var el = document.getElementById('logList');
    var key = state.currentId || '__unassigned__';
    var entries = state.logs[key] || [];
    if(!entries.length){
      el.innerHTML = '<div class="log-empty">No rolls yet — click any stat, save, skill, or attack.</div>';
      return;
    }
    el.innerHTML = entries.map(function(e){
      var lineClass = 'log-entry' + (e.isCrit ? ' crit' : (e.isFumble ? ' fumble' : ''));
      var totalClass = (e.isCrit || e.isFumble) ? 'hl' : 'total';
      var tag = e.isCrit ? ' <span class="tag-crit">CRIT</span>' : (e.isFumble ? ' <span class="tag-fumble">FAIL</span>' : '');
      return '<div class="' + lineClass + '">' + esc(e.label) + ': ' + e.detail + ' = <span class="' + totalClass + '">' + e.total + esc(e.suffix) + '</span>' + tag + '</div>';
    }).join('');
  }

  function saveLibrary(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({version:1, monsters: state.monsters}));
    }catch(err){
      console.error('Could not save library', err);
      alert('Could not save to local storage. Your browser may be blocking it (private/incognito mode can limit this).');

  }

  function loadLibrary(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var data = JSON.parse(raw);
        state.monsters = (data && data.monsters) || [];
        return;
      }
    }catch(err){
      console.error('Could not load library', err);
    }
    state.monsters = [seedMonster()];
    try{
      SEED_MARKDOWN_STATBLOCKS.forEach(function(md){
        state.monsters = state.monsters.concat(parseMarkdownLibrary(md));
      });
    }catch(err){
      console.error('Could not seed markdown statblocks', err);
    }
  }

  function applyTheme(themeId){
    var valid = THEMES.some(function(t){ return t.id === themeId; });
    state.theme = valid ? themeId : 'blue';
    if(state.theme === 'blue'){
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', state.theme);
    }
    try{ localStorage.setItem(THEME_STORAGE_KEY, state.theme); }catch(err){}
    renderThemeGrid();
  }

  function loadTheme(){
    var saved = null;
    try{ saved = localStorage.getItem(THEME_STORAGE_KEY); }catch(err){}
    applyTheme(saved || 'blue');
  }

  function renderThemeGrid(){
    var grid = document.getElementById('themeGrid');
    if(!grid) return;
    grid.innerHTML = THEMES.map(function(t){
      var bg = 'linear-gradient(135deg, ' + t.swatch[0] + ' 0%, ' + t.swatch[1] + ' 55%, ' + t.swatch[2] + ' 100%)';
      var active = t.id === state.theme ? ' active' : '';
      return '<button type="button" class="theme-swatch' + active + '" style="background:' + bg + '" data-action="select-theme" data-theme="' + t.id + '" title="' + esc(t.label) + '">' +
        '<span class="ts-check">✓</span>' +
        '<span class="theme-swatch-label">' + esc(t.label) + '</span>' +
      '</button>';
    }).join('');
  }

  function saveBgImage(){
    try{
      if(state.bgImage) localStorage.setItem(BGIMG_STORAGE_KEY, state.bgImage);
      else localStorage.removeItem(BGIMG_STORAGE_KEY);
    }catch(err){
      console.error('Could not save background image', err);
    }
  }

  function renderCatalog(){
    var list = document.getElementById('catList');

    var filtered = state.monsters.filter(function(m){ return m.name.toLowerCase().indexOf(q) !== -1; });

      var sel = m.id === state.currentId ? ' selected' : '';
      return '<div class="cat-card' + sel + '" data-action="select-monster" data-id="' + m.id + '">' +
        '<div class="cc-name">' + esc(m.name) + '</div>' +
        '<div class="cc-meta">CR ' + esc(m.cr) + ' \u00b7 ' + esc(m.type) + '</div>' +
      '</div>';
    }).join('');
  }

  function traitLikeHtml(list){
    return (list || []).map(function(t){
      var body = highlightSpells(highlightCastingFrequency(highlightNumbers(esc(t.text))));
      var label = t.name ? '<b>' + esc(t.name) + '.</b> ' : '';
      return '<div class="trait">' + label + body + '</div>';
    }).join('');
  }

  function renderStage(){
    var el = document.getElementById('stageInner');
    var m = getMonster(state.currentId);
    if(!m){
      el.innerHTML = '<div class="empty-state"><div class="big">No creature selected</div>Choose one from the catalog on the left,<br>or create a new one to begin.</div>';
      return;
    }
    var abilities = ['str','dex','con','int','wis','cha'];
    var abilityBoxes = abilities.map(function(a){
      var score = m.abilities[a] || 10;
      var md = abilityMod(score);
      return '<div class="ability-box" data-action="roll-ability" data-mod="' + md + '" data-label="' + esc(m.name) + ' \u2014 ' + a.toUpperCase() + ' check">' +
        '<div class="ab-name">' + a.toUpperCase() + '</div>' +
        '<div class="ab-score">' + score + '</div>' +
        '<div class="ab-mod">' + fmt(md) + '</div>' +
      '</div>';
    }).join('');

    var saveBoxes = abilities.map(function(a){
      var score = m.abilities[a] || 10;
      var md = abilityMod(score);
      var override = null;
      (m.saves || []).forEach(function(s){
        if(s.name && String(s.name).trim().toLowerCase().slice(0, 3) === a){ override = s.bonus; }
      });
      var proficient = override !== null;
      var bonus = proficient ? override : md;
      var cls = 'ability-box save-box' + (proficient ? ' proficient' : '');
      return '<div class="' + cls + '" data-action="roll-save" data-bonus="' + bonus + '" data-label="' + esc(m.name) + ' \u2014 ' + a.toUpperCase() + ' save">' +
        '<div class="ab-name">' + a.toUpperCase() + (proficient ? ' <span class="prof-dot" title="Proficient">\u25CF</span>' : '') + '</div>' +
        '<div class="ab-mod save-mod">' + fmt(bonus) + '</div>' +
      '</div>';
    }).join('');

    var skillsHtml = (m.skills || []).map(function(s){
      return '<button class="pill" data-action="roll-skill" data-bonus="' + s.bonus + '" data-label="' + esc(m.name) + ' \u2014 ' + esc(s.name) + '">' + esc(s.name) + ' ' + fmt(s.bonus) + '</button>';
    }).join('');

    var traitsHtml = traitLikeHtml(m.traits);

    var actionsHtml = (m.actions || []).map(function(a){
      var rolls = '';
      if(a.toHit !== null && a.toHit !== undefined && a.toHit !== ''){
        rolls += '<button class="stamp" data-action="roll-attack" data-bonus="' + a.toHit + '" data-label="' + esc(m.name) + ' \u2014 ' + esc(a.name) + ' to hit">' + fmt(Number(a.toHit)) + ' to hit</button>';
      }
      if(a.damage){
        rolls += '<button class="stamp dmg" data-action="roll-damage" data-dice="' + esc(a.damage) + '" data-typelabel="' + esc(a.damageType||'') + '" data-label="' + esc(m.name) + ' \u2014 ' + esc(a.name) + ' damage">' + esc(a.damage) + (a.damageType ? (' ' + esc(a.damageType)) : '') + '</button>';
      }
      return '<div class="action-row"><span class="a-name">' + esc(a.name) + '.</span> ' + highlightSpells(highlightCastingFrequency(highlightNumbers(esc(a.text)))) +
        (rolls ? '<div class="action-rolls">' + rolls + '</div>' : '') + '</div>';
    }).join('');

    var legendaryHtml = traitLikeHtml(m.legendary);
    var reactionsHtml = traitLikeHtml(m.reactions);
    var bonusActionsHtml = traitLikeHtml(m.bonusActions);

    var dexMod = abilityMod(m.abilities.dex || 10);
    var initBonus = (m.initiative === null || m.initiative === undefined || m.initiative === '') ? dexMod : Number(m.initiative);

    el.innerHTML =
      '<div class="sb-card">' +
        '<div class="sb-topbar">' +
          '<button data-action="duplicate-monster" data-id="' + m.id + '">Duplicate</button>' +
          '<button data-action="export-monster" data-id="' + m.id + '">Export</button>' +
          '<button data-action="edit-monster" data-id="' + m.id + '">Edit</button>' +
          '<button class="danger" data-action="delete-monster" data-id="' + m.id + '">Delete</button>' +
        '</div>' +
        '<div class="sb-head">' +
          (m.image ? '<img class="sb-portrait" src="' + m.image + '">' : '') +
          '<div>' +
            '<p class="sb-name">' + esc(m.name) + '</p>' +
            '<p class="sb-sub">' + esc(m.size) + ' ' + esc(m.type) + ', ' + esc(m.alignment) + '</p>' +
          '</div>' +
          '<div class="sb-cr">Challenge<b>' + esc(m.cr) + '</b>Prof. bonus ' + fmt(Number(m.prof||2)) + '</div>' +
        '</div>' +
        '<div class="sb-core">' +
          '<div><b>AC</b> ' + esc(m.ac) + (m.acNote ? ' (' + esc(m.acNote) + ')' : '') + '</div>' +
          '<div><b>HP</b> ' + esc(m.hp) + (m.hpDice ? ' (' + esc(m.hpDice) + ')' : '') +
            (m.hpDice ? ' <button class="pill" style="padding:2px 8px;font-size:13px;" data-action="roll-hp" data-dice="' + esc(m.hpDice) + '" data-label="' + esc(m.name) + ' \u2014 hit points">roll</button>' : '') +
          '</div>' +
          '<div><b>Speed</b> ' + esc(m.speed) + '</div>' +
          '<div><b>Initiative</b> ' + fmt(initBonus) +
            ' <button class="pill" style="padding:2px 8px;font-size:13px;" data-action="roll-initiative" data-bonus="' + initBonus + '" data-label="' + esc(m.name) + ' \u2014 initiative">roll</button>' +
          '</div>' +
        '</div>' +
        '<div class="section-title">Ability checks</div>' +
        '<div class="ability-grid">' + abilityBoxes + '</div>' +
        '<div class="section-title">Saving throws</div>' +
        '<div class="ability-grid save-grid">' + saveBoxes + '</div>' +
        (skillsHtml ? '<div class="pillrow">' + skillsHtml + '</div>' : '') +
        (m.resistances ? '<div class="sb-line"><b>Resistances</b> ' + esc(m.resistances) + '</div>' : '') +
        (m.immunities ? '<div class="sb-line"><b>Immunities</b> ' + esc(m.immunities) + '</div>' : '') +
        (m.senses ? '<div class="sb-line"><b>Senses</b> ' + esc(m.senses) + '</div>' : '') +
        (m.languages ? '<div class="sb-line"><b>Languages</b> ' + esc(m.languages) + '</div>' : '') +
        '<div class="sb-divider"></div>' +
        (traitsHtml || '') +
        (actionsHtml ? '<div class="section-title">Actions</div>' + actionsHtml : '') +
        (bonusActionsHtml ? '<div class="section-title">Bonus actions</div>' + bonusActionsHtml : '') +
        (reactionsHtml ? '<div class="section-title">Reactions</div>' + reactionsHtml : '') +
        (legendaryHtml ? '<div class="section-title">Legendary actions</div>' + legendaryHtml : '') +
      '</div>';
  }

  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-action]');
    if(!t) return;
    var action = t.getAttribute('data-action');

    if(action === 'toggle-settings'){
      var panel = document.getElementById('settingsPanel');
      var btn = document.getElementById('settingsBtn');
      var willOpen = !panel.classList.contains('open');
      panel.classList.toggle('open', willOpen);
      btn.classList.toggle('open', willOpen);
      e.stopPropagation();
    } else if(action === 'select-theme'){
      applyTheme(t.getAttribute('data-theme'));
    } else if(action === 'upload-bg-image'){
      document.getElementById('bgImageInput').click();
    } else if(action === 'remove-bg-image'){
      state.bgImage = null;
      saveBgImage();
      applyBgImage();
    } else if(action === 'select-monster'){
      state.currentId = t.getAttribute('data-id');
      render();
    } else if(action === 'new-monster'){
      openEditor(null);
    } else if(action === 'edit-monster'){
      openEditor(getMonster(t.getAttribute('data-id')));
    } else if(action === 'duplicate-monster'){
      var src = getMonster(t.getAttribute('data-id'));
      if(src){
        var copy = JSON.parse(JSON.stringify(src));
        copy.id = uid();
        copy.name = copy.name + ' (copy)';
        state.monsters.push(copy);
        state.currentId = copy.id;
        saveLibrary();
        render();
      }
    } else if(action === 'delete-monster'){
      var id = t.getAttribute('data-id');
      var target = getMonster(id);
      if(target){
        showConfirm('Delete "' + target.name + '"? This cannot be undone.', function(){
          state.monsters = state.monsters.filter(function(m){ return m.id !== id; });
          if(state.currentId === id) state.currentId = state.monsters.length ? state.monsters[0].id : null;
          saveLibrary();
          render();
        });
      }
    } else if(action === 'confirm-yes'){
      document.getElementById('confirmOverlay').style.display = 'none';
      var cb = pendingConfirmCallback;
      pendingConfirmCallback = null;
      if(cb) cb();
    } else if(action === 'confirm-no'){
      document.getElementById('confirmOverlay').style.display = 'none';
      pendingConfirmCallback = null;
    } else if(action === 'export-monster'){
      var m = getMonster(t.getAttribute('data-id'));
      if(m) downloadJSON({version:1, monsters:[m]}, (m.name.replace(/[^a-z0-9]+/gi,'_').toLowerCase() || 'monster') + '.json');
    } else if(action === 'export-all'){
      downloadJSON({version:1, monsters: state.monsters}, 'bestiary-export.json');
    } else if(action === 'trigger-import'){
      document.getElementById('fileImportInput').click();
    } else if(action === 'trigger-import-md'){
      document.getElementById('mdImportInput').click();
    } else if(action === 'clear-log'){
      var logKey = state.currentId || '__unassigned__';
      state.logs[logKey] = [];
      renderLog();
    } else if(action === 'close-rolllog'){
      document.getElementById('rolllogPanel').style.display = 'none';
    } else if(action === 'open-spell'){
      openSpellWindow(t.getAttribute('data-spell'));
    } else if(action === 'close-spell'){
      document.getElementById('spellWindow').style.display = 'none';
    } else if(action === 'roll-ability'){
      rollD20(parseInt(t.getAttribute('data-mod'), 10), t.getAttribute('data-label'));
    } else if(action === 'roll-save' || action === 'roll-skill' || action === 'roll-attack' || action === 'roll-initiative'){
      rollD20(parseInt(t.getAttribute('data-bonus'), 10), t.getAttribute('data-label'));
    } else if(action === 'roll-damage'){
      rollDamage(t.getAttribute('data-dice'), t.getAttribute('data-label'), t.getAttribute('data-typelabel'));
    } else if(action === 'roll-hp'){
      rollDamage(t.getAttribute('data-dice'), t.getAttribute('data-label'), '');
    }
  });

  document.getElementById('modeToggle').addEventListener('click', function(e){
    var b = e.target.closest('button[data-mode]');
    if(!b) return;
    state.mode = b.getAttribute('data-mode');
    Array.prototype.forEach.call(document.querySelectorAll('#modeToggle button'), function(btn){

  function downloadJSON(obj, filename){
    var blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  document.getElementById('fileImportInput').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        var incoming = Array.isArray(data) ? data : (data.monsters || [data]);
        incoming.forEach(function(m){
          m.id = uid();
          state.monsters.push(m);
        });
        if(incoming.length){
          state.currentId = state.monsters[state.monsters.length-1].id;
        }
        saveLibrary();
        render();
      }catch(err){
        alert('Could not read that file. Make sure it is a JSON file exported from this app.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  // ---- Markdown stat block import ----
  // Understands the common "Homebrewery-style" 5e markdown stat block format
  // (blockquote-prefixed or plain), and maps each recognized line into the
  // same fields the rest of the app already knows how to render as clickable
  // ability/save/skill boxes and rollable attack buttons.

  var SECTION_HEADING_MAP = {
    'actions': 'actions',
    'bonus actions': 'bonusActions',
    'reactions': 'reactions',
    'legendary actions': 'legendary',
    'villain actions': 'legendary',
    'mythic actions': 'legendary'
  };

  function stripMdEmphasis(s){
    return String(s || '')
      .replace(/<[^>]+>/g, '')
      .replace(/\*\*\*(.+?)\*\*\*/g, '$1')
      .replace(/\*\*(.+?)\*\*/g, '$1')
      .replace(/\*(.+?)\*/g, '$1')
      .replace(/__(.+?)__/g, '$1')
      .replace(/_(.+?)_/g, '$1')
      .replace(/\\([*_])/g, '$1')
      .replace(/[ \t]+/g, ' ')
      .trim();
  }

  function mdLabelValue(line, label){
    var re = new RegExp('^\\s*[-*]?\\s*\\*{0,3}' + label + '\\*{0,3}:?\\s*(.*)$', 'i');
    var m = line.match(re);
    return m ? m[1].trim() : null;
  }

  function parseNameBonusList(text){
    return String(text || '').split(',').map(function(part){
      var m = part.trim().match(/^([A-Za-z][A-Za-z\s]*?)\s*([+\-]\s?\d+)$/);
      if(!m) return null;
      return {name: m[1].trim(), bonus: parseInt(m[2].replace(/\s/g, ''), 10)};
    }).filter(function(x){ return x; });
  }

  function crToNumber(cr){
    if(!cr) return 0;
    cr = String(cr).trim();
    if(cr.indexOf('/') !== -1){
      var parts = cr.split('/');
      return parseFloat(parts[0]) / (parseFloat(parts[1]) || 1);
    }
    return parseFloat(cr) || 0;
  }

  function profFromCR(cr){
    var n = crToNumber(cr);
    if(n >= 29) return 9;
    if(n >= 25) return 8;
    if(n >= 21) return 7;
    if(n >= 17) return 6;
    if(n >= 13) return 5;
    if(n >= 9) return 4;
    if(n >= 5) return 3;
    return 2;
  }

  function splitMarkdownBlocks(text){
    var lines = String(text || '').replace(/\r\n/g, '\n').split('\n').map(function(l){
      return l.replace(/^>+\s?/, '');
    });
    var blocks = [];
    var current = [];
    var seenHeading = false;
    lines.forEach(function(line){
      if(/^#{1,2}\s+\S/.test(line.trim())){
        if(seenHeading && current.length){
          blocks.push(current.join('\n'));
          current = [];
        }
        seenHeading = true;
      }
      current.push(line);
    });
    if(current.length) blocks.push(current.join('\n'));
    return blocks.filter(function(b){ return /#{1,2}\s+\S/.test(b); });
  }

  function extractAttackRolls(item){
    var text = item.text;
    var hitMatch = text.match(/([+\-]\s?\d+)\s*to hit/i) || text.match(/Attack Roll:\s*([+\-]\s?\d+)/i);
    if(hitMatch) item.toHit = parseInt(hitMatch[1].replace(/\s/g, ''), 10);
    var dmgMatch = text.match(/\(\s*(\d+d\d+(?:\s*[+\-]\s*\d+)?)\s*\)\s*([A-Za-z]+)?\s*damage/i);
    if(dmgMatch){
      item.damage = dmgMatch[1].replace(/\s/g, '');
      if(dmgMatch[2]) item.damageType = dmgMatch[2].toLowerCase();
    }
  }

  function parseMarkdownMonster(block){
    var rawLines = block.split('\n');
    var m = blankMonster();
    var vulnerabilities = '', resistancesRaw = '', damageImmunitiesRaw = '', conditionImmunitiesRaw = '', unifiedImmunitiesRaw = '', unifiedResistancesRaw = '';
    var gotName = false, gotSubtitle = false, profExplicit = false;
    var currentSection = 'traits';
    var currentItem = null;
    var tableHeaderSeen = false;
    var abilityTableFound = false;

    function pushItem(section, name, text){
      var item = {name: name, text: String(text || '').trim()};
      if(section === 'actions'){ item.toHit = null; item.damage = ''; item.damageType = ''; }
      m[section].push(item);
      return item;
    }

    for(var i = 0; i < rawLines.length; i++){
      var line = rawLines[i].trim();
      if(!line) continue;
      if(/^[_\-*=]{3,}$/.test(line)) continue;

      var headingMatch = line.match(/^#{1,4}\s+(.+)$/);
      if(headingMatch){
        var headingText = stripMdEmphasis(headingMatch[1]);
        if(!gotName){
          m.name = headingText || m.name;
          gotName = true;
        } else {
          currentSection = SECTION_HEADING_MAP[headingText.toLowerCase().trim()] || 'traits';
          currentItem = null;
        }
        continue;
      }

      if(gotName && !gotSubtitle){
        gotSubtitle = true;
        var subMatch = line.match(/^\*([^*].*[^*])\*$/);
        if(subMatch){
          var subParts = subMatch[1].trim().match(/^([\w\-]+)\s+(.+),\s*(.+)$/);
          if(subParts){
            m.size = subParts[1];
            m.type = subParts[2];
            m.alignment = subParts[3];
          }
          continue;
        }
      }

      if(/^\|?\s*str\s*\|\s*dex\s*\|\s*con\s*\|\s*int\s*\|\s*wis\s*\|\s*cha\s*\|?\s*$/i.test(line)){
        tableHeaderSeen = true;
        continue;
      }
      if(tableHeaderSeen && /^\|?[\s:\-|]+\|?$/.test(line)){
        continue;
      }
      if(tableHeaderSeen){
        var cells = line.split('|').map(function(c){ return c.trim(); }).filter(function(c){ return c.length; });
        if(cells.length >= 6){
          ['str','dex','con','int','wis','cha'].forEach(function(ab, idx){
            var numMatch = cells[idx].match(/-?\d+/);
            if(numMatch){ m.abilities[ab] = parseInt(numMatch[0], 10); abilityTableFound = true; }
          });
        }
        tableHeaderSeen = false;
        continue;
      }

      if(/\bstr\b/i.test(line) && /\bdex\b/i.test(line) && /\bcon\b/i.test(line)){
        var inlineFound = false;
        ['str','dex','con','int','wis','cha'].forEach(function(ab){
          var abRe = new RegExp('\\b' + ab + '\\b\\s*\\**\\s*(-?\\d{1,2})', 'i');
          var abMatch = line.match(abRe);
          if(abMatch){ m.abilities[ab] = parseInt(abMatch[1], 10); inlineFound = true; }
        });
        if(inlineFound){ abilityTableFound = true; continue; }
      }

      var val;
      if((val = mdLabelValue(line, 'Armor Class')) !== null){
        var acMatch = val.match(/(\d+)\s*(?:\(([^)]+)\))?/);
        if(acMatch){ m.ac = parseInt(acMatch[1], 10); m.acNote = stripMdEmphasis(acMatch[2] || ''); }
        continue;
      }
      if((val = mdLabelValue(line, 'Hit Points')) !== null){
        var hpMatch = val.match(/(\d+)\s*(?:\(([^)]+)\))?/);
        if(hpMatch){ m.hp = parseInt(hpMatch[1], 10); m.hpDice = stripMdEmphasis(hpMatch[2] || ''); }
        continue;
      }
      if((val = mdLabelValue(line, 'Speed')) !== null){ m.speed = stripMdEmphasis(val); continue; }
      if((val = mdLabelValue(line, 'Initiative')) !== null){
        var initMatch = val.match(/([+\-]?\d+)/);
        if(initMatch) m.initiative = parseInt(initMatch[1], 10);
        continue;
      }
      if((val = mdLabelValue(line, 'Proficiency Bonus')) !== null){
        var profMatch = val.match(/([+\-]?\d+)/);
        if(profMatch){ m.prof = parseInt(profMatch[1], 10); profExplicit = true; }
        continue;
      }
      if((val = mdLabelValue(line, 'Saving Throws')) !== null){ m.saves = parseNameBonusList(val); continue; }
      if((val = mdLabelValue(line, 'Skills')) !== null){ m.skills = parseNameBonusList(val); continue; }
      if((val = mdLabelValue(line, 'Damage Vulnerabilities')) !== null){ vulnerabilities = stripMdEmphasis(val); continue; }
      if((val = mdLabelValue(line, 'Damage Resistances')) !== null){ resistancesRaw = stripMdEmphasis(val); continue; }
      if((val = mdLabelValue(line, 'Damage Immunities')) !== null){ damageImmunitiesRaw = stripMdEmphasis(val); continue; }
      if((val = mdLabelValue(line, 'Condition Immunities')) !== null){ conditionImmunitiesRaw = stripMdEmphasis(val); continue; }
      if((val = mdLabelValue(line, 'Vulnerabilities')) !== null){ vulnerabilities = stripMdEmphasis(val); continue; }
      if((val = mdLabelValue(line, 'Resistances')) !== null){ unifiedResistancesRaw = stripMdEmphasis(val); continue; }
      if((val = mdLabelValue(line, 'Immunities')) !== null){ unifiedImmunitiesRaw = stripMdEmphasis(val); continue; }
      if((val = mdLabelValue(line, 'Senses')) !== null){ m.senses = stripMdEmphasis(val); continue; }
      if((val = mdLabelValue(line, 'Languages')) !== null){ m.languages = stripMdEmphasis(val); continue; }
      if((val = mdLabelValue(line, 'Challenge')) !== null){
        var crMatch = val.match(/^([\d/]+)/);
        if(crMatch) m.cr = crMatch[1];
        continue;
      }

      var nameMatch = line.match(/^[-*]?\s*\*{2,3}([^*]+?)\.?\*{2,3}\.?\s*(.*)$/);
      if(nameMatch){
        var itemName = stripMdEmphasis(nameMatch[1]).replace(/\.$/, '').trim();
        var itemText = stripMdEmphasis(nameMatch[2]);
        currentItem = pushItem(currentSection, itemName, itemText);
        if(currentSection === 'actions') extractAttackRolls(currentItem);
        continue;
      }

      var plainText = stripMdEmphasis(line.replace(/^[-*]\s+/, ''));
      if(!plainText) continue;
      if(currentItem){
        currentItem.text = (currentItem.text + ' ' + plainText).trim();
        if(currentSection === 'actions') extractAttackRolls(currentItem);
      } else {
        currentItem = pushItem(currentSection, '', plainText);
      }
    }

    if(!abilityTableFound){
      ['str','dex','con','int','wis','cha'].forEach(function(ab){
        var re = new RegExp('\\b' + ab + '\\b\\s*\\**\\s*(\\d{1,2})', 'i');
        var mt = block.match(re);
        if(mt) m.abilities[ab] = parseInt(mt[1], 10);
      });
    }

    var resParts = [];
    if(resistancesRaw) resParts.push(resistancesRaw);
    if(unifiedResistancesRaw) resParts.push(unifiedResistancesRaw);
    if(vulnerabilities) resParts.push('Vulnerable: ' + vulnerabilities);
    m.resistances = resParts.join('; ');

    var immParts = [];
    if(damageImmunitiesRaw) immParts.push(damageImmunitiesRaw);
    if(conditionImmunitiesRaw) immParts.push(conditionImmunitiesRaw);
    if(unifiedImmunitiesRaw) immParts.push(unifiedImmunitiesRaw);
    m.immunities = immParts.join('; ');

    if(!profExplicit) m.prof = profFromCR(m.cr);

    return gotName ? m : null;
  }

  function parseMarkdownLibrary(text){
    return splitMarkdownBlocks(text).map(parseMarkdownMonster).filter(function(m){ return m; });
  }

  function readFileAsText(file){
    return new Promise(function(resolve){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = function(){ resolve(null); };
      reader.readAsText(file);
    });
  }

  function importMarkdownFiles(fileList){
    var files = Array.prototype.filter.call(fileList, function(f){
      return /\.md$/i.test(f.name) || f.type === 'text/markdown' || f.type === 'text/plain' || f.type === '';
    });
    if(!files.length){
      alert('No .md files found to import. Drop or select files with a .md extension.');
      return;
    }
    Promise.all(files.map(function(file){
      return readFileAsText(file).then(function(text){ return {name: file.name, text: text}; });
    })).then(function(results){
      var allImported = [];
      var failedFiles = [];
      results.forEach(function(r){
        if(r.text === null){ failedFiles.push(r.name); return; }
        var imported;
        try{ imported = parseMarkdownLibrary(r.text); }catch(err){ console.error('Markdown import failed for ' + r.name, err); imported = []; }
        if(!imported.length){ failedFiles.push(r.name); return; }
        allImported = allImported.concat(imported);
      });
      if(allImported.length){
        allImported.forEach(function(m){ state.monsters.push(m); });
        state.currentId = allImported[allImported.length - 1].id;
        saveLibrary();
        render();
      }
      var msg = '';
      if(allImported.length){
        msg = 'Imported ' + allImported.length + ' creature' + (allImported.length === 1 ? '' : 's') + ': ' + allImported.map(function(m){ return m.name; }).join(', ') + '.';
      }
      if(failedFiles.length){
        msg += (msg ? '\n\n' : '') + 'Could not find a recognizable stat block in: ' + failedFiles.join(', ') + '.';
      }
      if(!msg) msg = 'Could not find a recognizable stat block in that file. Expected a 5e-style markdown stat block (name heading, "Armor Class", "Hit Points", ability score table, etc.).';
      else if(allImported.length) msg += '\n\nReview the stat block(s) and use Edit to fix anything the parser missed.';
      alert(msg);
    });
  }

  document.getElementById('mdImportInput').addEventListener('change', function(e){
    if(e.target.files.length) importMarkdownFiles(e.target.files);
    e.target.value = '';
  });

  var dragDepth = 0;
  function dragHasFiles(e){
    return e.dataTransfer && e.dataTransfer.types && Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') !== -1;
  }
  window.addEventListener('dragenter', function(e){
    if(!dragHasFiles(e)) return;
    e.preventDefault();
    dragDepth++;
    document.getElementById('dropOverlay').classList.add('active');
  });
  window.addEventListener('dragover', function(e){
    if(!dragHasFiles(e)) return;
    e.preventDefault();
  });
  window.addEventListener('dragleave', function(e){
    if(!dragHasFiles(e)) return;
    dragDepth = Math.max(0, dragDepth - 1);
    if(dragDepth === 0) document.getElementById('dropOverlay').classList.remove('active');
  });
  window.addEventListener('drop', function(e){
    if(!dragHasFiles(e)){ return; }
    e.preventDefault();
    dragDepth = 0;
    document.getElementById('dropOverlay').classList.remove('active');
    if(e.dataTransfer.files && e.dataTransfer.files.length) importMarkdownFiles(e.dataTransfer.files);
  });

  var SPELL_REGEX = (function(){
    var names = Object.keys(SPELLS).sort(function(a, b){ return b.length - a.length; });
    var escaped = names.map(function(n){ return n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); });
    return new RegExp('\\b(' + escaped.join('|') + ')\\b', 'gi');
  })();

  function highlightNumbers(text){
    var re = /\bDC\s*(\d+)\b|\b(\d+(?:\/\d+)?)-?\s?(?:foot|feet|ft\.?)\b/gi;
    return text.replace(re, function(match, dcNum, distNum){
      if(dcNum !== undefined){
        return '<span class="num-highlight">DC ' + dcNum + '</span>';
      }
      return '<span class="num-highlight">' + distNum + ' ft.</span>';
    });
  }

  function highlightCastingFrequency(text){
    var re = /(Cantrips?(?: \(at will\))?|\d+(?:st|nd|rd|th) level(?: \(\d+ slots?\))?|At will|\d+\/day(?: each)?|\d+\/week(?: each)?|\d+\/rest(?: each)?|\d+\/short rest(?: each)?|\d+\/long rest(?: each)?)(\s*:)/gi;
    var seenFirst = false;
    return text.replace(re, function(match, freq, colon){
      var prefix = seenFirst ? '<br>' : '';
      seenFirst = true;
      return prefix + '<span class="cast-freq">' + freq + colon + '</span>';
    });
  }

  function highlightSpells(text){
    return text.replace(SPELL_REGEX, function(match){
      var key = match.toLowerCase();
      if(!SPELLS[key]) return match;
      return '<span class="spell-link" data-action="open-spell" data-spell="' + key + '">' + match + '</span>';
    });
  }

      return '<div class="list-row">' +
        '<input placeholder="Ability (e.g. Wisdom)" data-list="saves" data-index="' + i + '" data-field="name" value="' + esc(s.name) + '">' +
        '<input type="number" placeholder="Bonus" style="max-width:80px" data-list="saves" data-index="' + i + '" data-field="bonus" value="' + s.bonus + '">' +
        '<button type="button" class="rm" data-editaction="rm-row" data-list="saves" data-index="' + i + '">\u00d7</button>' +
      '</div>';
    }).join('');

    document.getElementById('rows-skills').innerHTML = m.skills.map(function(s, i){
      return '<div class="list-row">' +
        '<input placeholder="Skill name" data-list="skills" data-index="' + i + '" data-field="name" value="' + esc(s.name) + '">' +
        '<input type="number" placeholder="Bonus" style="max-width:80px" data-list="skills" data-index="' + i + '" data-field="bonus" value="' + s.bonus + '">' +
        '<button type="button" class="rm" data-editaction="rm-row" data-list="skills" data-index="' + i + '">\u00d7</button>' +
      '</div>';
    }).join('');

    document.getElementById('rows-traits').innerHTML = m.traits.map(function(s, i){
      return '<div class="list-row">' +
        '<input placeholder="Trait name" style="max-width:160px" data-list="traits" data-index="' + i + '" data-field="name" value="' + esc(s.name) + '">' +
        '<textarea placeholder="Description" data-list="traits" data-index="' + i + '" data-field="text">' + esc(s.text) + '</textarea>' +
        '<button type="button" class="rm" data-editaction="rm-row" data-list="traits" data-index="' + i + '">\u00d7</button>' +
      '</div>';
    }).join('');

    document.getElementById('rows-actions').innerHTML = m.actions.map(function(s, i){
      return '<div class="list-row">' +
        '<input placeholder="Action name" style="max-width:140px" data-list="actions" data-index="' + i + '" data-field="name" value="' + esc(s.name) + '">' +
        '<textarea placeholder="Description" data-list="actions" data-index="' + i + '" data-field="text">' + esc(s.text) + '</textarea>' +
        '<input type="number" placeholder="To hit" style="max-width:70px" data-list="actions" data-index="' + i + '" data-field="toHit" value="' + (s.toHit === null || s.toHit === undefined ? '' : s.toHit) + '">' +
        '<input placeholder="Damage e.g. 1d8+3" style="max-width:120px" data-list="actions" data-index="' + i + '" data-field="damage" value="' + esc(s.damage) + '">' +
        '<input placeholder="Damage type" style="max-width:90px" data-list="actions" data-index="' + i + '" data-field="damageType" value="' + esc(s.damageType) + '">' +
        '<button type="button" class="rm" data-editaction="rm-row" data-list="actions" data-index="' + i + '">\u00d7</button>' +
      '</div>';
    }).join('');

    document.getElementById('rows-reactions').innerHTML = (m.reactions || []).map(function(s, i){
      return '<div class="list-row">' +
        '<input placeholder="Name" style="max-width:160px" data-list="reactions" data-index="' + i + '" data-field="name" value="' + esc(s.name) + '">' +
        '<textarea placeholder="Description" data-list="reactions" data-index="' + i + '" data-field="text">' + esc(s.text) + '</textarea>' +
        '<button type="button" class="rm" data-editaction="rm-row" data-list="reactions" data-index="' + i + '">\u00d7</button>' +
      '</div>';
    }).join('');

    document.getElementById('rows-bonusactions').innerHTML = (m.bonusActions || []).map(function(s, i){
      return '<div class="list-row">' +
        '<input placeholder="Name" style="max-width:160px" data-list="bonusActions" data-index="' + i + '" data-field="name" value="' + esc(s.name) + '">' +
        '<textarea placeholder="Description" data-list="bonusActions" data-index="' + i + '" data-field="text">' + esc(s.text) + '</textarea>' +
        '<button type="button" class="rm" data-editaction="rm-row" data-list="bonusActions" data-index="' + i + '">\u00d7</button>' +
      '</div>';
    }).join('');

    document.getElementById('rows-legendary').innerHTML = m.legendary.map(function(s, i){
      return '<div class="list-row">' +
        '<input placeholder="Name" style="max-width:160px" data-list="legendary" data-index="' + i + '" data-field="name" value="' + esc(s.name) + '">' +
        '<textarea placeholder="Description" data-list="legendary" data-index="' + i + '" data-field="text">' + esc(s.text) + '</textarea>' +
        '<button type="button" class="rm" data-editaction="rm-row" data-list="legendary" data-index="' + i + '">\u00d7</button>' +
      '</div>';
    }).join('');
  }

  document.addEventListener('input', function(e){
    var t = e.target;
    if(t.hasAttribute('data-ability')){
      state.editing.abilities[t.getAttribute('data-ability')] = parseInt(t.value, 10) || 0;
      return;
    }
    if(t.hasAttribute('data-list')){
      var list = t.getAttribute('data-list');
      var idx = parseInt(t.getAttribute('data-index'), 10);
      var field = t.getAttribute('data-field');
      var val = t.value;
      if(field === 'bonus'){ val = parseInt(val, 10) || 0; }
      if(field === 'toHit'){ val = val === '' ? null : (parseInt(val, 10) || 0); }
      state.editing[list][idx][field] = val;
    }
  });

  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-editaction]');
    if(!t) return;
    var action = t.getAttribute('data-editaction');
    var m = state.editing;

    if(action === 'add-save'){ m.saves.push({name:'', bonus:0}); renderListRows(); }
    else if(action === 'add-skill'){ m.skills.push({name:'', bonus:0}); renderListRows(); }
    else if(action === 'add-trait'){ m.traits.push({name:'', text:''}); renderListRows(); }
    else if(action === 'add-action'){ m.actions.push({name:'', text:'', toHit:null, damage:'', damageType:''}); renderListRows(); }
    else if(action === 'add-reaction'){ if(!m.reactions) m.reactions = []; m.reactions.push({name:'', text:''}); renderListRows(); }
    else if(action === 'add-bonusaction'){ if(!m.bonusActions) m.bonusActions = []; m.bonusActions.push({name:'', text:''}); renderListRows(); }
    else if(action === 'add-legendary'){ m.legendary.push({name:'', text:''}); renderListRows(); }
    else if(action === 'rm-row'){
      var list = t.getAttribute('data-list');
      var idx = parseInt(t.getAttribute('data-index'), 10);
      m[list].splice(idx, 1);
      renderListRows();
    }
    else if(action === 'upload-image'){
      document.getElementById('imageUploadInput').click();
    }
    else if(action === 'remove-image'){
      m.image = null;
      renderEditor();
    }
    else if(action === 'cancel'){
      document.getElementById('modalOverlay').remove();
      state.editing = null;
    }
    else if(action === 'save'){
      m.name = document.getElementById('f-name').value || 'Unnamed creature';
      m.size = document.getElementById('f-size').value;
      m.type = document.getElementById('f-type').value;
      m.alignment = document.getElementById('f-align').value;
      m.cr = document.getElementById('f-cr').value;
      m.prof = parseInt(document.getElementById('f-prof').value, 10) || 0;
      m.ac = parseInt(document.getElementById('f-ac').value, 10) || 10;
      m.acNote = document.getElementById('f-acnote').value;
      m.hp = parseInt(document.getElementById('f-hp').value, 10) || 1;
      m.hpDice = document.getElementById('f-hpdice').value;
      m.speed = document.getElementById('f-speed').value;
      var initVal = document.getElementById('f-init').value;
      m.initiative = initVal === '' ? null : (parseInt(initVal, 10) || 0);
      m.senses = document.getElementById('f-senses').value;
      m.languages = document.getElementById('f-langs').value;
      m.immunities = document.getElementById('f-immunities').value;
      m.resistances = document.getElementById('f-resistances').value;

      var idx = state.monsters.findIndex(function(x){ return x.id === m.id; });
      if(idx === -1) state.monsters.push(m);
      else state.monsters[idx] = m;

      state.currentId = m.id;
      saveLibrary();
      document.getElementById('modalOverlay').remove();
      state.editing = null;
      render();
    }
  });

  document.getElementById('imageUploadInput').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      state.editing.image = reader.result;
      renderEditor();
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  });

  document.getElementById('bgImageInput').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      state.bgImage = reader.result;
      saveBgImage();
      applyBgImage();
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  });

  document.addEventListener('click', function(e){
    var panel = document.getElementById('settingsPanel');
    var btn = document.getElementById('settingsBtn');
    if(!panel.classList.contains('open')) return;
    if(panel.contains(e.target) || btn.contains(e.target)) return;
    panel.classList.remove('open');
    btn.classList.remove('open');
  });

  function rectsOverlap(a, b){
    return !(a.right <= b.left || a.left >= b.right || a.bottom <= b.top || a.top >= b.bottom);
  }

  function otherPanelVisible(otherPanel){
    return otherPanel && otherPanel.style.display !== 'none';
  }

  function makeDraggable(panel, handle, otherPanel){
    var dragging = false, offsetX = 0, offsetY = 0;
    handle.addEventListener('pointerdown', function(e){
      if(e.target.closest('button')) return;
      dragging = true;
      var rect = panel.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
      panel.style.right = 'auto';
      panel.style.bottom = 'auto';
      panel.style.left = rect.left + 'px';
      panel.style.top = rect.top + 'px';
      handle.setPointerCapture(e.pointerId);
    });
    handle.addEventListener('pointermove', function(e){
      if(!dragging) return;
      var w = panel.offsetWidth, h = panel.offsetHeight;
      var maxX = window.innerWidth - w;
      var maxY = window.innerHeight - h;
      var x = Math.max(0, Math.min(e.clientX - offsetX, maxX));
      var y = Math.max(0, Math.min(e.clientY - offsetY, maxY));
      if(otherPanelVisible(otherPanel)){
        var candidate = {left:x, top:y, right:x + w, bottom:y + h};
        var o = otherPanel.getBoundingClientRect();
        if(rectsOverlap(candidate, o)) return;
      }
      panel.style.left = x + 'px';
      panel.style.top = y + 'px';
    });
    handle.addEventListener('pointerup', function(){ dragging = false; });
    handle.addEventListener('pointercancel', function(){ dragging = false; });
  }

  function makeResizable(panel, handle, minW, minH, maxW, maxH, otherPanel){
    var resizing = false, startX = 0, startY = 0, startW = 0, startH = 0, lastGoodW = 0, lastGoodH = 0;
    handle.addEventListener('pointerdown', function(e){
      resizing = true;
      startX = e.clientX;
      startY = e.clientY;
      var rect = panel.getBoundingClientRect();
      startW = rect.width;
      startH = rect.height;
      lastGoodW = rect.width;
      lastGoodH = rect.height;
      handle.setPointerCapture(e.pointerId);
      e.stopPropagation();
    });
    handle.addEventListener('pointermove', function(e){
      if(!resizing) return;
      var rect = panel.getBoundingClientRect();
      var viewportMaxW = window.innerWidth - rect.left - 8;
      var viewportMaxH = window.innerHeight - rect.top - 8;
      var effectiveMaxW = Math.min(maxW, viewportMaxW);
      var effectiveMaxH = Math.min(maxH, viewportMaxH);
      var w = Math.max(minW, Math.min(startW + (e.clientX - startX), effectiveMaxW));
      var h = Math.max(minH, Math.min(startH + (e.clientY - startY), effectiveMaxH));
      if(otherPanelVisible(otherPanel)){
        var candidate = {left:rect.left, top:rect.top, right:rect.left + w, bottom:rect.top + h};
        var o = otherPanel.getBoundingClientRect();
        if(rectsOverlap(candidate, o)){
          w = lastGoodW;
          h = lastGoodH;
        } else {
          lastGoodW = w;
          lastGoodH = h;
        }
      }
      panel.style.width = w + 'px';
      panel.style.height = h + 'px';
    });
    handle.addEventListener('pointerup', function(){ resizing = false; });
    handle.addEventListener('pointercancel', function(){ resizing = false; });
  }

  loadLibrary();
  if(state.monsters.length) state.currentId = state.monsters[0].id;
  loadTheme();
  loadBgImage();
  render();
  var rolllogPanelEl = document.getElementById('rolllogPanel');
  var spellWindowEl = document.getElementById('spellWindow');
  makeDraggable(rolllogPanelEl, document.getElementById('rolllogHead'), spellWindowEl);
  makeResizable(rolllogPanelEl, document.getElementById('rolllogResize'), 240, 140, 640, 620, spellWindowEl);
  makeDraggable(spellWindowEl, document.getElementById('spellWindowHead'), rolllogPanelEl);
  makeResizable(spellWindowEl, document.getElementById('spellWindowResize'), 260, 200, 640, 640, rolllogPanelEl);
})();
</script>
</body>
